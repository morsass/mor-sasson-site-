<!doctype html>
<html lang="he" dir="rtl"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>קביעת תור · מור ששון, רפואה סינית</title>
<meta name="description" content="קביעת תור לטיפול ברפואה סינית אצל מור ששון: בחירת טיפול, יום ושעה.">
<link rel="icon" href="../assets/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf8f3;--alt:#f3f5f1;--card:#fff;--ink:#3b3f45;--g:#3a5a40;--g2:#84a98c;--icon:#eef1ec;--line:#e6e9e2;--head:#fff;--bad:#a8432f;--badbg:#f7e4df;--warn:#8a6417;--warnbg:#f6ecd5;--on:#fff;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171a17;--alt:#1d211d;--card:#242924;--ink:#d9ddd5;--g:#9bc4a1;--g2:#6f9a77;--icon:#2e352e;--line:#343a34;--head:#1b1f1b;--bad:#ec8b74;--badbg:#3a221c;--warn:#e1b75a;--warnbg:#372d18;--on:#10210f;color-scheme:dark}}
*,*:before,*:after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Heebo',system-ui,Arial,sans-serif;line-height:1.7;font-size:17px}
a{color:inherit}
[hidden]{display:none!important}
header{position:sticky;top:0;background:var(--head);box-shadow:0 1px 0 var(--line);z-index:10}
.nav{max-width:760px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:10px 20px;gap:12px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}.brand img{width:40px;height:auto}
.brand b{display:block;color:var(--g);font-size:20px;line-height:1.1}.brand small{color:var(--g2);font-size:13px}
.back{color:var(--g);font-weight:500;font-size:15px;text-decoration:none;padding:6px 12px;border-radius:999px}
.back:hover{background:var(--icon)}
main{max-width:760px;margin:0 auto;padding:26px 20px 90px}
h1{margin:0 0 4px;color:var(--g);font-size:clamp(30px,6vw,40px);line-height:1.2}
.sub{margin:0 0 22px;color:var(--ink);opacity:.8}
.steps{display:flex;gap:8px;margin:0 0 20px;flex-wrap:wrap}
.steps span{font-size:14px;font-weight:500;padding:3px 14px;border-radius:999px;background:var(--icon);color:var(--ink);opacity:.75}
.steps span.on{background:var(--g);color:var(--on);opacity:1}
.steps span.done{color:var(--g);opacity:1}
.card{background:var(--card);border-radius:24px;padding:24px;box-shadow:0 6px 24px rgba(30,50,30,.07);margin-bottom:18px}
.card h2{margin:0 0 14px;font-size:21px;color:var(--g)}
.svcs{display:grid;gap:12px}
.svc{display:flex;align-items:center;gap:14px;text-align:start;width:100%;border:2px solid var(--line);background:var(--bg);border-radius:18px;padding:14px 16px;cursor:pointer;font:inherit;color:inherit}
.svc:hover{border-color:var(--g2)}
.svc[aria-pressed="true"]{border-color:var(--g);background:var(--icon)}
.svc .dot{width:14px;height:14px;border-radius:50%;flex:none;background:var(--c,var(--g))}
.svc .nm{flex:1;font-weight:500}.svc .nm small{display:block;font-weight:400;opacity:.75;font-size:14px}
.svc .pr{font-weight:700;color:var(--g);white-space:nowrap}
.mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.mh b{font-size:19px}
.arrow{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--g);cursor:pointer;font-size:20px;line-height:1;display:grid;place-items:center}
.arrow:disabled{opacity:.3;cursor:not-allowed}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.cal .wd{font-size:13px;opacity:.65;padding:4px 0}
.cal button,.cal i{aspect-ratio:1;border-radius:14px;font:inherit;font-size:16px;border:0;display:grid;place-items:center}
.cal button{background:var(--bg);color:var(--ink);cursor:pointer;border:1px solid var(--line)}
.cal button:disabled{background:transparent;border-color:transparent;opacity:.28;cursor:default}
.cal button.has{background:var(--icon);border-color:var(--g2);color:var(--g);font-weight:700}
.cal button.sel{background:var(--g);color:var(--on);border-color:var(--g)}
.cal button.today{outline:2px solid var(--g2);outline-offset:1px}
.times{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px;margin-top:6px}
.times button{padding:10px 0;border-radius:14px;border:1px solid var(--g2);background:var(--bg);color:var(--g);font:inherit;font-weight:700;cursor:pointer;font-variant-numeric:tabular-nums}
.times button[aria-pressed="true"]{background:var(--g);color:var(--on);border-color:var(--g)}
.lbl{display:block;font-weight:500;margin:0 0 4px}
input[type=text],input[type=tel]{width:100%;padding:13px 14px;margin:0 0 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit}
input[type=tel]{direction:ltr;text-align:right}
input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--g2);outline-offset:2px}
.pill{background:var(--g);color:var(--on);padding:13px 30px;border-radius:999px;font-weight:700;border:0;font:inherit;font-weight:700;cursor:pointer;display:inline-block;text-decoration:none;text-align:center}
.pill:disabled{opacity:.5;cursor:not-allowed}
.pill.ghost{background:transparent;color:var(--g);border:2px solid var(--g)}
.pill.block{display:block;width:100%}
.note{font-size:14.5px;opacity:.8}
.err{background:var(--badbg);color:var(--bad);border-radius:12px;padding:10px 14px;margin:0 0 14px;font-size:15px}
.warn{background:var(--warnbg);color:var(--warn);border-radius:12px;padding:10px 14px;margin:0 0 14px;font-size:15px}
.sum{display:grid;gap:4px;margin:0 0 16px;padding:14px 16px;border-radius:16px;background:var(--icon)}
.sum b{color:var(--g)}
.ok{text-align:center;padding:6px 0 2px}
.ok .ck{width:64px;height:64px;border-radius:50%;background:var(--g);color:var(--on);display:grid;place-items:center;margin:0 auto 10px;font-size:34px}
.kv{display:grid;gap:10px;margin:14px 0}
.kv div{padding:12px 14px;border-radius:14px;background:var(--bg);border:1px solid var(--line)}
.kv small{display:block;opacity:.7;font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 180px}
.hp{position:absolute;inset-inline-start:-9999px;width:1px;height:1px;overflow:hidden}
.skel{height:56px;border-radius:16px;background:var(--icon);margin-bottom:12px;animation:p 1.2s ease-in-out infinite}
@keyframes p{50%{opacity:.5}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}html{scroll-behavior:auto}}
</style></head>
<body>
<header><div class="nav">
  <a class="brand" href="/"><img src="../assets/logo.png" alt=""><span><b>מור ששון</b><small>רפואה סינית</small></span></a>
  <span style="display:flex;gap:6px;align-items:center"><a class="back" id="mylink" href="../my/" hidden>התורים שלי</a><a class="back" href="/">לאתר ←</a></span>
</div></header>
<main id="main">
  <h1>קביעת תור</h1>
  <p class="sub">בחרו טיפול, יום ושעה. התור נשמר לכם מיד, והאישור נשלח אליכם בוואטסאפ.</p>
  <div class="steps" id="steps" aria-hidden="true"><span id="s1">1 · טיפול</span><span id="s2">2 · מועד</span><span id="s3">3 · פרטים</span></div>
  <div id="app"><div class="skel"></div><div class="skel"></div></div>
</main>
<script src="../config.js"></script>
<script>
(function(){
"use strict";
const CFG=window.CLINIC_CFG||{};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const WD=["ראשון","שני","שלישי","רביעי","חמישי","שישי","שבת"];
const MONTHS=["ינואר","פברואר","מרץ","אפריל","מאי","יוני","יולי","אוגוסט","ספטמבר","אוקטובר","נובמבר","דצמבר"];
const money=n=>"₪"+(Math.round((Number(n)||0)*100)/100).toLocaleString("he-IL");
const toMin=t=>{const[a,b]=String(t||"0:0").split(":").map(Number);return a*60+(b||0)};
const toHM=m=>`${pad(Math.floor(m/60))}:${pad(m%60)}`;
const ymd=(y,m,d)=>`${y}-${pad(m+1)}-${pad(d)}`;
const fmtD=s=>{const[y,m,d]=s.split("-");return`${d}/${m}/${y}`};
const dow=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(Date.UTC(y,m-1,d)).getUTCDay()};
const dayNum=s=>{const[y,m,d]=s.split("-").map(Number);return Date.UTC(y,m-1,d)/864e5};   // יום מוחלט
const naive=(s,min)=>dayNum(s)*1440+min;                                                 // דקות "נאיביות" (שעון ישראל)
function ilNow(){
  const p=Object.fromEntries(new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Jerusalem",hourCycle:"h23",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"}).formatToParts(new Date()).map(x=>[x.type,x.value]));
  const date=`${p.year}-${p.month}-${p.day}`;return{date,min:Number(p.hour)*60+Number(p.minute)};
}
function addDaysStr(s,n){const[y,m,d]=s.split("-").map(Number);const t=new Date(Date.UTC(y,m-1,d+n));return ymd(t.getUTCFullYear(),t.getUTCMonth(),t.getUTCDate())}

const ERR={slot_taken:"השעה הזו כבר נתפסה. בחרו שעה אחרת.",too_soon:"אי אפשר לקבוע תור קרוב כל כך. בחרו מועד מאוחר יותר.",too_far:"אפשר לקבוע תור רק לטווח הקרוב.",
  phone_invalid:"מספר הנייד לא תקין.",name_invalid:"מלאו שם מלא.",too_many_open:"יש לכם כבר כמה תורים עתידיים. לשינוי או ביטול אפשר לפנות אליי בוואטסאפ.",service_invalid:"הטיפול שנבחר לא זמין.",time_invalid:"המועד לא תקין."};

async function rpc(fn,args){
  if(!CFG.url||!CFG.anonKey)throw new Error("not_configured");
  const r=await fetch(`${CFG.url}/rest/v1/rpc/${fn}`,{method:"POST",headers:{"Content-Type":"application/json",apikey:CFG.anonKey,Authorization:"Bearer "+CFG.anonKey},body:JSON.stringify(args||{})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.message||"error");
  return j;
}

const st={info:null,busy:[],svc:null,date:null,time:null,month:null,busyKey:"",sending:false};
const app=$("#app");

function rangesFor(date){
  const I=st.info;
  if((I.blocked||[]).some(b=>date>=b.from&&date<=(b.to||b.from)))return[];
  const r=Object.prototype.hasOwnProperty.call(I.overrides||{},date)?I.overrides[date]:((I.days||{})[dow(date)]||[]);
  return(r||[]).filter(x=>x.s&&x.e);
}
function slotsFor(date){
  const I=st.info,sv=st.svc;if(!sv)return[];
  const now=ilNow(),minNaive=naive(now.date,now.min)+Number(I.leadHours||0)*60,step=Number(I.slotStep||30),dur=sv.minutes;
  const busy=st.busy.filter(b=>b.date===date);const out=[];
  rangesFor(date).forEach(r=>{
    for(let m=toMin(r.s);m+dur<=toMin(r.e);m+=step){
      if(naive(date,m)<minNaive)continue;
      if(busy.some(b=>toMin(b.start)<m+dur&&toMin(b.start)+b.minutes>m))continue;
      out.push(toHM(m));
    }
  });
  return out;
}
function horizonEnd(){return addDaysStr(ilNow().date,Number(st.info.horizonDays||60))}

async function loadBusy(){
  const from=ilNow().date,to=horizonEnd(),key=from+to;
  st.busy=await rpc("pub_busy",{d_from:from,d_to:to});st.busyKey=key;
}

function stepUI(n){["s1","s2","s3"].forEach((id,i)=>{const e=$("#"+id);e.className=i+1===n?"on":(i+1<n?"done":"")})}

function render(){
  const I=st.info;
  let h="";
  // 1 treatment
  const multi=I.services.length>1;
  if(multi||!st.svc){
    h+=`<section class="card" aria-labelledby="h1"><h2 id="h1">איזה טיפול?</h2><div class="svcs">${I.services.map(s=>`<button class="svc" style="--c:${esc(s.color||"#3a5a40")}" data-svc="${esc(s.id)}" aria-pressed="${st.svc&&st.svc.id===s.id}"><span class="dot"></span><span class="nm">${esc(s.name)}<small>${s.minutes} דקות${s.deposit>0?` · מקדמה ${money(s.deposit)}`:""}</small></span><span class="pr">${money(s.price)}</span></button>`).join("")}</div></section>`;
  }
  // 2 date/time
  if(st.svc){
    const now=ilNow(),[ty,tm]=now.date.split("-").map(Number);
    if(!st.month)st.month={y:ty,m:tm-1};
    const first=new Date(Date.UTC(st.month.y,st.month.m,1)),startDow=first.getUTCDay(),dim=new Date(Date.UTC(st.month.y,st.month.m+1,0)).getUTCDate();
    const maxD=horizonEnd();
    const canPrev=(st.month.y*12+st.month.m)>(ty*12+tm-1);
    const [my,mm]=maxD.split("-").map(Number);const canNext=(st.month.y*12+st.month.m)<(my*12+mm-1);
    let cells="";for(let i=0;i<startDow;i++)cells+="<i></i>";
    let any=false;
    for(let d=1;d<=dim;d++){
      const ds=ymd(st.month.y,st.month.m,d);const has=ds>=now.date&&ds<=maxD&&slotsFor(ds).length>0;if(has)any=true;
      cells+=`<button type="button" data-day="${ds}" class="${has?"has":""} ${st.date===ds?"sel":""} ${ds===now.date?"today":""}" ${has?"":"disabled"} aria-label="${d} ב${MONTHS[st.month.m]}${has?"":", אין שעות פנויות"}" aria-pressed="${st.date===ds}">${d}</button>`;
    }
    h+=`<section class="card" aria-labelledby="h2"><h2 id="h2">מתי?</h2>
      <div class="mh"><button class="arrow" id="nx" aria-label="חודש הבא" ${canNext?"":"disabled"}>›</button><b>${MONTHS[st.month.m]} ${st.month.y}</b><button class="arrow" id="pv" aria-label="חודש קודם" ${canPrev?"":"disabled"}>‹</button></div>
      <div class="cal">${WD.map(w=>`<div class="wd">${w.slice(0,1)}׳</div>`).join("")}${cells}</div>
      ${any?"":`<p class="note" style="margin:12px 0 0">אין שעות פנויות בחודש הזה. נסו את החודש הבא.</p>`}
      ${st.date?`<h3 style="margin:18px 0 6px;font-size:17px">שעות פנויות ביום ${WD[dow(st.date)]}, ${fmtD(st.date)}</h3><div class="times">${slotsFor(st.date).map(t=>`<button type="button" data-time="${t}" aria-pressed="${st.time===t}">${t}</button>`).join("")||'<span class="note">אין שעות פנויות ביום הזה</span>'}</div>`:`<p class="note" style="margin:14px 0 0">הימים המסומנים בירוק פנויים.</p>`}
    </section>`;
  }
  // 3 details
  if(st.svc&&st.date&&st.time){
    h+=`<section class="card" aria-labelledby="h3"><h2 id="h3">הפרטים שלכם</h2>
      <div class="sum"><div><b>${esc(st.svc.name)}</b> · ${st.svc.minutes} דקות · ${money(st.svc.price)}</div><div>יום ${WD[dow(st.date)]}, ${fmtD(st.date)} בשעה <b>${st.time}</b></div>${st.svc.deposit>0?`<div class="note">מקדמה לאישור התור: ${money(st.svc.deposit)}</div>`:""}</div>
      <form id="f" novalidate>
        <label class="lbl" for="nm">שם מלא</label><input type="text" id="nm" autocomplete="name" maxlength="80" required>
        <label class="lbl" for="ph">טלפון נייד (לוואטסאפ)</label><input type="tel" id="ph" autocomplete="tel" inputmode="tel" placeholder="050-0000000" required>
        <div class="hp" aria-hidden="true"><label>אל תמלאו<input type="text" id="hp" tabindex="-1" autocomplete="off"></label></div>
        <div id="fe" class="err" role="alert" hidden></div>
        <p class="note" style="margin:0 0 14px">${esc(policyText())}</p>
        <button class="pill block" id="go" type="submit">קביעת התור</button>
      </form></section>`;
  }
  app.innerHTML=h;
  stepUI(!st.svc?1:(!(st.date&&st.time)?2:3));
  bind();
}

function policyText(){const p=st.info.policy||{freeHours:24,fullHours:12};return`מדיניות ביטול: עד ${p.freeHours} שעות לפני התור ללא עלות. בין ${p.freeHours} ל-${p.fullHours} שעות: דמי ביטול בגובה המקדמה. פחות מ-${p.fullHours} שעות או אי הגעה: חיוב מלא.`}

function bind(){
  app.querySelectorAll("[data-svc]").forEach(b=>b.onclick=()=>{st.svc=st.info.services.find(s=>s.id===b.dataset.svc);st.date=null;st.time=null;render();const t=$("#h2");if(t)t.scrollIntoView({block:"start",behavior:"smooth"})});
  app.querySelectorAll("[data-day]").forEach(b=>b.onclick=()=>{st.date=b.dataset.day;st.time=null;render();const t=app.querySelector(".times");if(t)t.scrollIntoView({block:"center",behavior:"smooth"})});
  app.querySelectorAll("[data-time]").forEach(b=>b.onclick=()=>{st.time=b.dataset.time;render();const t=$("#h3");if(t)t.scrollIntoView({block:"start",behavior:"smooth"})});
  const nx=$("#nx"),pv=$("#pv");
  if(nx)nx.onclick=()=>{let{y,m}=st.month;m++;if(m>11){m=0;y++}st.month={y,m};render()};
  if(pv)pv.onclick=()=>{let{y,m}=st.month;m--;if(m<0){m=11;y--}st.month={y,m};render()};
  const f=$("#f");if(f)f.onsubmit=submit;
}

async function submit(e){
  e.preventDefault();if(st.sending)return;
  const nm=$("#nm").value.trim(),ph=$("#ph").value.trim(),fe=$("#fe");
  const show=m=>{fe.textContent=m;fe.hidden=false;fe.scrollIntoView({block:"center"})};fe.hidden=true;
  if($("#hp").value)return;                                   // בוט
  if(nm.length<2)return show(ERR.name_invalid);
  if(!/^(\+?972|0)[\d\-\s]{8,12}$/.test(ph.replace(/\s/g,"")))return show(ERR.phone_invalid);
  st.sending=true;const b=$("#go");b.disabled=true;b.textContent="קובע…";
  try{
    const r=await rpc("create_booking",{p_service:st.svc.id,p_date:st.date,p_start:st.time,p_name:nm,p_phone:ph});
    done(r);
  }catch(err){
    st.sending=false;b.disabled=false;b.textContent="קביעת התור";
    const code=String(err.message||"");
    if(code==="slot_taken"||code==="too_soon"){show(ERR[code]);st.time=null;try{await loadBusy()}catch(_){}render();return}
    show(ERR[code]||"משהו השתבש, נסו שוב בעוד רגע. אפשר גם לפנות אליי בוואטסאפ.");
  }
}

/* ---- מסך אישור ---- */
function gcalUrl(a,info){
  const d=a.date.replaceAll("-",""),s=toMin(a.start),e=s+a.minutes,t=m=>`${pad(Math.floor(m/60))}${pad(m%60)}00`;
  return"https://calendar.google.com/calendar/render?"+new URLSearchParams({action:"TEMPLATE",text:`${a.serviceName} · ${info.bizName||"מור ששון"}`,dates:`${d}T${t(s)}/${d}T${t(e)}`,ctz:"Asia/Jerusalem",location:info.address||"",details:info.notes||""}).toString();
}
function icsBlob(a,info){
  const d=a.date.replaceAll("-",""),s=toMin(a.start),e=s+a.minutes,t=m=>`${pad(Math.floor(m/60))}${pad(m%60)}00`;
  const L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//mor-sasson.com//he","BEGIN:VEVENT",`UID:${Date.now()}@mor-sasson.com`,`DTSTAMP:${new Date().toISOString().replace(/[-:]/g,"").slice(0,15)}Z`,
    `DTSTART;TZID=Asia/Jerusalem:${d}T${t(s)}`,`DTEND;TZID=Asia/Jerusalem:${d}T${t(e)}`,`SUMMARY:${a.serviceName} · ${info.bizName||"מור ששון"}`,`LOCATION:${(info.address||"").replace(/[,;]/g,"\\$&")}`,"END:VEVENT","END:VCALENDAR"];
  return new Blob([L.join("\r\n")],{type:"text/calendar;charset=utf-8"});
}
function hypUrl(info,a,id){
  if(!info.hyp)return"";
  return info.hyp.replaceAll("{amount}",encodeURIComponent(a.deposit||0)).replaceAll("{name}",encodeURIComponent(a.clientName||"")).replaceAll("{id}",encodeURIComponent(id||""));
}
function done(r){
  const a=r.appt,info=r.info||{};
  try{if(r.clientToken)localStorage.setItem("myToken",r.clientToken)}catch(_){}
  const pend=a.status==="pending";
