<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#15302a">
<title>קליניקה · מור ששון</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700&family=Suez+One&display=swap">
<style>
/* Layout: dark jade rail on the right, quiet paper workspace; ink-and-seal palette drawn from a Chinese-medicine clinic — jade for action, cinnabar seal for warnings, gold for money. */
:root{
  --bg:#f1f2ee; --surface:#ffffff; --sunk:#e8eae4; --line:#d6dad2; --hatch:#dfe2db;
  --ink:#1a231f; --muted:#5d6963; --jade:#1d6b5c; --jade-ink:#ffffff; --jade-soft:#d9eae4;
  --cin:#b33e28; --cin-soft:#f6e1db; --gold:#94690f; --gold-soft:#f3e8cf; --plum:#6f4a8c;
  --rail:#15302a; --rail-fg:#b9d0c8; --rail-on:#e7c46a; --shadow:0 1px 2px rgb(20 40 30 / .08),0 4px 16px rgb(20 40 30 / .06);
  --display:"Suez One","Frank Ruhl Libre",Georgia,serif;
  --body:"Assistant","Arial Hebrew",Arial,sans-serif;
  --hour:56px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111614; --surface:#1a201d; --sunk:#222a26; --line:#313b36; --hatch:#1e2522;
  --ink:#e3eae6; --muted:#93a29b; --jade:#6cc2ac; --jade-ink:#0b1c17; --jade-soft:#1b342e;
  --cin:#ec8b74; --cin-soft:#3a221c; --gold:#e1b75a; --gold-soft:#372d18; --plum:#c3a2dd;
  --rail:#0a1210; --rail-fg:#9fb6ad; --rail-on:#e7c46a; --shadow:0 1px 2px rgb(0 0 0 / .4);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111614; --surface:#1a201d; --sunk:#222a26; --line:#313b36; --hatch:#1e2522;
  --ink:#e3eae6; --muted:#93a29b; --jade:#6cc2ac; --jade-ink:#0b1c17; --jade-soft:#1b342e;
  --cin:#ec8b74; --cin-soft:#3a221c; --gold:#e1b75a; --gold-soft:#372d18; --plum:#c3a2dd;
  --rail:#0a1210; --rail-fg:#9fb6ad; --rail-on:#e7c46a; --shadow:0 1px 2px rgb(0 0 0 / .4);
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;direction:rtl}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--jade);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.ltr{direction:ltr;unicode-bidi:isolate}

/* shell */
.app{display:grid;grid-template-columns:76px 1fr;height:100%}
.rail{background:var(--rail);color:var(--rail-fg);display:flex;flex-direction:column;align-items:stretch;gap:2px;padding:10px 6px;overflow-y:auto}
.seal{width:44px;height:44px;margin:2px auto 12px;border-radius:10px;background:var(--rail-on);color:var(--rail);display:grid;place-items:center;font-family:var(--display);font-size:22px;line-height:1}
.rail a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;border-radius:10px;color:inherit;text-decoration:none;font-size:11.5px;font-weight:600;position:relative}
.rail a svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.rail a:hover{background:rgb(255 255 255 / .06)}
.rail a[aria-current="page"]{color:#fff;background:rgb(255 255 255 / .09)}
.rail a[aria-current="page"]::before{content:"";position:absolute;inset-inline-start:-6px;top:10px;bottom:10px;width:3px;border-radius:3px;background:var(--rail-on)}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:10px;padding:8px 18px;background:var(--surface);border-bottom:1px solid var(--line)}
.top .brand{font-family:var(--display);font-size:18px;color:var(--jade);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.top .sp{flex:1}
.search{position:relative;width:min(280px,40vw)}
.search input{width:100%;border:1px solid var(--line);background:var(--sunk);border-radius:999px;padding:6px 14px}
.search .res{position:absolute;inset-inline:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);z-index:40;overflow:hidden}
.search .res button{display:flex;justify-content:space-between;width:100%;border:0;background:none;padding:8px 12px;text-align:start;cursor:pointer}
.search .res button:hover{background:var(--sunk)}
.ibtn{position:relative;width:38px;height:38px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.ibtn:hover{background:var(--sunk)}
.ibtn svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.badge{position:absolute;top:2px;inset-inline-end:0;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--cin);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
#view{flex:1;overflow:auto;min-height:0}
.page{padding-inline:20px;padding-block:20px 90px;max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.page-head h1{font-family:var(--display);font-weight:400;font-size:28px;margin:0;line-height:1.15;text-wrap:balance}
.page-head p{margin:2px 0 0;color:var(--muted)}
.crumbs{font-size:13px;color:var(--muted)}
.with-sub{display:grid;grid-template-columns:190px 1fr;min-height:100%}
.subnav{border-inline-end:1px solid var(--line);background:var(--surface);padding:14px 10px;display:flex;flex-direction:column;gap:4px}
.subnav button{border:0;background:none;text-align:start;padding:9px 12px;border-radius:10px;cursor:pointer;font-weight:600;color:var(--muted)}
.subnav button[aria-pressed="true"]{background:var(--sunk);color:var(--ink)}

/* parts */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.card h2,.sec-title{font-size:17px;margin:0;font-weight:700}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.grid-auto{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;padding:8px 14px;border-radius:10px;cursor:pointer;text-decoration:none;white-space:nowrap;font-size:14px}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--jade);border-color:var(--jade);color:var(--jade-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ink{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.danger{color:var(--cin);border-color:color-mix(in srgb,var(--cin) 40%,var(--line))}
.btn.wa{color:var(--jade);border-color:color-mix(in srgb,var(--jade) 45%,var(--line))}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.chip.jade{background:var(--jade-soft);color:var(--jade)}
.chip.cin{background:var(--cin-soft);color:var(--cin)}
.chip.gold{background:var(--gold-soft);color:var(--gold)}
.chip.ex{background:transparent;border:1px dashed var(--line)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
input,select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 10px;width:100%;min-width:0}
textarea{min-height:84px;resize:vertical;line-height:1.5}
input[type="checkbox"]{width:auto}
input[type="tel"],input[type="url"],input[type="time"],input[type="number"],input[type="date"]{direction:ltr;text-align:right}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.form .full{grid-column:1/-1}
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 0;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--ink)}
.seg{display:inline-flex;background:var(--sunk);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:5px 12px;border-radius:8px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.empty{padding:22px;text-align:center;color:var(--muted);background:var(--sunk);border-radius:12px}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 12px;text-align:start;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:700;background:var(--sunk)}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--sunk)}
.fab{position:fixed;inset-inline-end:calc(76px + 22px);bottom:calc(22px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:16px;border:0;background:var(--ink);color:var(--bg);display:grid;place-items:center;cursor:pointer;box-shadow:0 6px 18px rgb(0 0 0 / .22);z-index:20}
.fab svg{width:24px;height:24px;stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round}
.toast{position:fixed;inset-inline:0;bottom:calc(20px + env(safe-area-inset-bottom,0px));margin:0 auto;width:max-content;max-width:calc(100% - 32px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-weight:600;z-index:90}
.switch{position:relative;width:40px;height:22px;flex:none}
.switch input{opacity:0;position:absolute;inset:0;margin:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:22px;background:var(--line);transition:background .15s}
.switch span::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s}
.switch input:checked+span{background:var(--jade)}
.switch input:checked+span::after{transform:translateX(-18px)}
.note{font-size:13px;color:var(--muted)}
.warn{font-size:13px;background:var(--gold-soft);color:var(--gold);border-radius:9px;padding:7px 10px}
.alert{font-size:13px;background:var(--cin-soft);color:var(--cin);border-radius:9px;padding:7px 10px}
.okbox{font-size:13px;background:var(--jade-soft);color:var(--jade);border-radius:9px;padding:7px 10px}

/* calendar */
.cal{display:flex;flex-direction:column;height:100%;min-height:0}
.cal-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 18px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.cal-nav{display:flex;align-items:center;gap:8px}
.span-seg{flex-wrap:nowrap}
.span-seg button{min-height:36px;padding:6px 12px}
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;padding:10px 12px}
.mhead{font-size:12px;color:var(--muted);text-align:center;font-weight:600;padding:4px 0}
.mcell{border:1px solid var(--line);background:var(--surface);border-radius:10px;min-height:86px;padding:6px;text-align:start;display:flex;flex-direction:column;gap:3px;cursor:pointer;font:inherit;color:inherit;overflow:hidden;min-width:0}
.mcell.other{opacity:.45}
.mcell.today{border-color:var(--jade);box-shadow:inset 0 0 0 1px var(--jade)}
.mcell b{font-size:14px}
.mcount{font-size:12px;font-weight:700;color:var(--jade)}
.mcell small{font-size:11px;color:var(--muted);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:760px){.mcell{min-height:60px;padding:4px}.mcell small{display:none}.mcount{font-size:11px}.span-seg{width:100%}.span-seg button{flex:1}}
.cal-nav .lbl{font-size:18px;font-weight:700;min-width:130px;text-align:center}
.cal-scroll{flex:1;overflow:auto;min-height:0;background:var(--surface)}
.cal-head{position:sticky;top:0;z-index:5;display:grid;background:var(--surface);border-bottom:1px solid var(--line)}
.cal-head div{padding:8px 4px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.cal-head .wd{font-size:18px;font-weight:700;color:var(--ink);line-height:1.2}
.cal-head .dt{font-size:12px;color:var(--muted);line-height:1.2}
.cal-head .today .wd,.cal-head .today .dt{color:var(--jade)}
.cal-head .today .wd{background:var(--jade-soft);border-radius:8px;padding:0 6px}
.cal-body{display:grid;position:relative}
.gut{position:relative;border-inline-start:1px solid var(--line)}
.gut span{position:absolute;inset-inline:0;text-align:center;font-size:12px;color:var(--muted);transform:translateY(-50%)}
.col{position:relative;border-inline-start:1px solid var(--line);background:#eceef1;cursor:copy}
.avail{position:absolute;inset-inline:0;background:#fff}
.lines{position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% var(--hour);opacity:.7}
.now{position:absolute;inset-inline:0;height:0;border-top:2px solid var(--cin);z-index:4;pointer-events:none}
.now::before{content:"";position:absolute;inset-inline-end:-5px;top:-6px;width:10px;height:10px;border-radius:50%;background:var(--cin)}
.ev{position:absolute;z-index:3;border-radius:9px;padding:5px 8px;overflow:hidden;cursor:pointer;font-size:12.5px;line-height:1.3;
  background:color-mix(in srgb,var(--c) 17%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 35%,transparent);border-inline-start:4px solid var(--c);color:var(--ink)}
.ev:hover{box-shadow:var(--shadow)}
.ev b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev .t{color:var(--muted)}
.ev .chip{font-size:10.5px;padding:0 6px;margin-bottom:2px}
.ev.paid{background:color-mix(in srgb,var(--muted) 14%,var(--surface));border-inline-start-color:var(--muted)}
.ev.cancelled{opacity:.55;text-decoration:line-through}
.ev.noshow{border-style:dashed}
.ev.pending{border-style:dashed;background:color-mix(in srgb,#c9a227 20%,var(--surface))}
.daychips{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;background:var(--surface);border-bottom:1px solid var(--line)}
.daychips button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:4px 10px;cursor:pointer;text-align:center;line-height:1.2}
.daychips button b{display:block;font-size:17px}
.daychips button[aria-pressed="true"]{background:var(--jade);color:var(--jade-ink);border-color:var(--jade)}

/* drawer */
.scrim{position:fixed;inset:0;background:rgb(10 20 16 / .38);z-index:50}
.drawer{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(430px,100%);background:var(--bg);z-index:60;display:flex;flex-direction:column;box-shadow:0 0 40px rgb(0 0 0 / .25)}
.dh{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--jade);color:var(--jade-ink);padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top,0px))}
.dh h2{margin:0;font-size:18px}
.dh .ibtn{color:inherit}
.dh .ibtn:hover{background:rgb(255 255 255 / .15)}
.db{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.df{display:flex;gap:10px;padding:12px 16px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface);position:relative}
.df .btn{flex:1;padding:11px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.who{display:flex;align-items:center;gap:10px}
.ava{width:40px;height:40px;border-radius:50%;background:var(--jade-soft);color:var(--jade);display:grid;place-items:center;font-weight:700;flex:none}
.who .nm{font-weight:700;font-size:16px}
.menu{position:absolute;bottom:calc(100% + 6px);inset-inline-end:16px;width:240px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 28px rgb(0 0 0 / .18);overflow:hidden}
.menu button{display:flex;align-items:center;justify-content:space-between;width:100%;border:0;border-bottom:1px solid var(--line);background:none;padding:11px 14px;cursor:pointer;font-weight:600;text-align:start}
.menu button:last-child{border-bottom:0}
.menu button:hover{background:var(--sunk)}
.menu button.red{color:var(--cin)}
.menu svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.pick{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.pick button{border:0;border-bottom:1px solid var(--line);background:none;padding:8px 12px;text-align:start;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
.pick button:last-child{border-bottom:0}
.pick button:hover{background:var(--sunk)}
.notes .n{border-inline-start:3px solid var(--gold);padding:6px 10px;background:var(--surface);border-radius:8px}
.vars{display:flex;flex-wrap:wrap;gap:6px}
.vars button{border:1px dashed var(--line);background:var(--surface);border-radius:999px;padding:2px 10px;font-size:12px;cursor:pointer}
.preview{white-space:pre-wrap;background:var(--sunk);border-radius:10px;padding:10px 12px;font-size:13.5px;border-inline-start:3px solid var(--jade);max-height:240px;overflow:auto}

/* pos */
.pos{display:grid;grid-template-columns:1fr 370px;height:100%;min-height:0}
.pos-items{display:flex;flex-direction:column;min-height:0;border-inline-end:1px solid var(--line)}
.pos-items .bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 18px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.pos-items .bar .tabs{border:0}
.tiles{padding:18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;overflow:auto;align-content:start}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:120px;text-align:center;justify-content:space-between}
.tile:hover{border-color:var(--jade);box-shadow:var(--shadow)}
.tile .k{font-size:12px;font-weight:700;color:var(--c,var(--jade))}
.tile .p{font-size:22px;font-weight:700}
.cart{display:flex;flex-direction:column;background:var(--surface);min-height:0}
.cart .lines{position:static;opacity:1;background:none;flex:1;overflow:auto;pointer-events:auto}
.cline{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line)}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px}
.qty button{border:0;background:none;width:26px;height:26px;cursor:pointer}
.totals{padding:10px 14px;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:14px}
.totals .grand{font-size:20px;font-weight:700}

/* misc */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.kpi .v{font-size:28px;font-weight:700;line-height:1.2}
.kpi .d{font-size:12.5px;font-weight:700}
.up{color:var(--jade)} .down{color:var(--cin)}
.week{display:grid;grid-template-columns:repeat(7,minmax(120px,1fr));gap:8px;overflow-x:auto}
.wday{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:120px}
.wday h3{margin:0;font-size:14px;text-align:center}
.rng{display:flex;flex-direction:column;gap:4px;background:var(--sunk);border-radius:9px;padding:6px}
.rng input{padding:4px 6px;font-size:13px}
.rep-cat{display:flex;flex-direction:column;gap:8px}
.rep-cat header{display:flex;flex-direction:column;gap:2px;padding-bottom:8px;border-bottom:1px solid var(--line);margin-bottom:4px}
.rep-cat header b{font-size:19px}
.rep-link{display:flex;align-items:center;justify-content:space-between;border:0;background:var(--sunk);border-radius:10px;padding:11px 14px;cursor:pointer;font-weight:600;text-align:start}
.rep-link:hover{background:var(--jade-soft)}
.auto-card{display:flex;flex-direction:column;gap:10px}
.flow{display:flex;align-items:center;gap:8px;color:var(--jade)}
.flow svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

.dot{width:14px;height:14px;border-radius:50%;background:var(--c)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:28px;height:28px;border-radius:50%;border:2px solid transparent;background:var(--c);cursor:pointer}

@media (max-width:900px){
  .pos{grid-template-columns:1fr;height:auto}
  .pos-items{border:0;max-height:none}
  .with-sub{grid-template-columns:1fr}
  .subnav{flex-direction:row;overflow-x:auto;border-inline-end:0;border-bottom:1px solid var(--line);padding:8px}
  .subnav button{white-space:nowrap}
}
@media (max-width:760px){
  .app{grid-template-columns:1fr;grid-template-rows:1fr auto}
  .rail{grid-row:2;flex-direction:row;overflow-x:auto;overflow-y:hidden;padding:4px 6px calc(4px + env(safe-area-inset-bottom,0px));gap:0}
  .seal{display:none}
  .rail a{min-width:66px;font-size:11px}
  .rail a[aria-current="page"]::before{inset-inline:14px;top:auto;bottom:-4px;width:auto;height:3px}
  .main{grid-row:1}
  .fab{inset-inline-end:18px;bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .top .brand{display:none}
  .search{flex:1;width:auto}
  .page{padding-inline:16px}
  .cal-bar{padding:8px 12px}
  .cal-nav .lbl{min-width:0;font-size:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.login{position:fixed;inset:0;z-index:200;background:var(--bg);display:grid;place-items:center;padding:20px}
.login .card{width:min(380px,100%);display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.login h1{font-family:var(--display);font-weight:400;font-size:26px;margin:0;color:var(--jade)}
.login .seal{margin:0}
.logout{font-size:13px;font-weight:600;color:var(--muted);border:0;background:none;cursor:pointer;padding:6px 8px;border-radius:8px}

<script>
/* ================= constants & utils ================= */
const WD=["ראשון","שני","שלישי","רביעי","חמישי","שישי","שבת"];
const MONTHS=["ינואר","פברואר","מרץ","אפריל","מאי","יוני","יולי","אוגוסט","ספטמבר","אוקטובר","נובמבר","דצמבר"];
const COLORS=["#1d6b5c","#b33e28","#94690f","#4a5fa8","#7a4f96","#2f8494","#5f7a24","#a34a72"];
const METHODS=["מזומן","ביט","פייבוקס","אשראי","העברה בנקאית"];
const $=s=>document.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const el=html=>{const t=document.createElement("template");t.innerHTML=html.trim();return t.content.firstElementChild};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseYmd=s=>{const[y,m,d]=String(s).split("-").map(Number);return new Date(y,(m||1)-1,d||1)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const startOfWeek=d=>{const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-x.getDay());return x};
const toMin=t=>{const[a,b]=String(t||"0:0").split(":").map(Number);return a*60+(b||0)};
const toHM=m=>`${pad(Math.floor(m/60))}:${pad(m%60)}`;
const money=n=>"₪"+(Math.round((Number(n)||0)*100)/100).toLocaleString("he-IL");
const fmtD=s=>{const d=parseYmd(s);return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`};
const fmtDT=iso=>{if(!iso)return"";const d=new Date(iso);return `${pad(d.getDate())}/${pad(d.getMonth()+1)} ${pad(d.getHours())}:${pad(d.getMinutes())}`};
const dayName=s=>WD[parseYmd(s).getDay()];
const todayStr=()=>ymd(new Date());
const aStart=a=>{const d=parseYmd(a.date);d.setHours(0,toMin(a.start),0,0);return d};
const aEnd=a=>new Date(aStart(a).getTime()+(Number(a.minutes)||60)*6e4);
const aEndHM=a=>toHM(toMin(a.start)+(Number(a.minutes)||60));
const intlPhone=p=>{let d=String(p||"").replace(/\D/g,"");if(d.startsWith("972"))return d;if(d.startsWith("0"))return "972"+d.slice(1);return d};
const waLink=(phone,text)=>`https://wa.me/${intlPhone(phone)}?text=${encodeURIComponent(text)}`;
const initial=n=>(String(n||"?").trim()[0]||"?");
const ICON={
 cal:'<svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>',

 clock:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>',

 plus:'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',

 noshow:'<svg viewBox="0 0 24 24"><circle cx="10" cy="8" r="3.5"/><path d="M3.5 20c.8-3.5 3.3-5.5 6.5-5.5s5.7 2 6.5 5.5M17 8l4 4M21 8l-4 4"/></svg>',
 trash:'<svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></svg>',

 filter:'<svg viewBox="0 0 24 24"><path d="M4 5h16l-6 7.5V19l-4 1.5v-8z"/></svg>',
 chev:'<svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>',
 chevR:'<svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>',
 up:'<svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg>',
 down:'<svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>',
 edit:'<svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>'
};

/* ================= defaults ================= */
const DEF_AUTO={
  confirm:{on:true,tpl:"שלום {שם}, התור שלך ל{טיפול} נקבע ליום {יום} {תאריך} בשעה {שעה}.\n📍 {כתובת}\n{הוראות}\n\n{דגשים}\n\nלהוספה ליומן: {קישור_יומן}\n{שורת_מקדמה}\n\nלשינוי או ביטול התור: {קישור_אישי}\n\n{מדיניות}"},
  reminder:{on:true,hours:24,tpl:"היי {שם}, תזכורת לתור ל{טיפול} ביום {יום} {תאריך} בשעה {שעה}.\n📍 {כתובת}\n{ניווט}\n\n{מדיניות}\nאם צריך לשנות, אפשר להשיב להודעה הזו."},
  after:{on:true,tpl:"תודה שהגעת היום, {שם}! 🌿\nיתרה לתשלום: {סכום}\n{קישורי_תשלום}\nהקבלה תישלח אליך כאן לאחר התשלום."},
  receipt:{on:true,tpl:"{קבלה}"},
  birthday:{on:false,tpl:"מזל טוב {שם}! מאחלים לך שנה בריאה ומאוזנת 🌿\n{עסק}"},
  winback:{on:false,days:60,tpl:"היי {שם}, עבר זמן מה מאז הטיפול האחרון. אם תרצה לקבוע תור, אפשר כאן: {קישור_הזמנה}\n{עסק}"}
};
const AUTO_META={
  confirm:{name:"אישור תור",cat:"popular",desc:"כשנקבע תור חדש, נשלחים ללקוח פרטי התור, הוראות הגעה, דגשים וקישור להוספה ליומן.",from:ICON.cal,trigger:"נקבע תור"},
  reminder:{name:"תזכורת לפני תור",cat:"popular",desc:"תזכורת בוואטסאפ מספר שעות לפני הטיפול, כולל כתובת וניווט.",from:ICON.clock,trigger:"שעות לפני התור",param:["hours","שעות לפני"]},
  after:{name:"תודה וקישור לתשלום",cat:"pay",desc:"בסוף טיפול שלא שולם, נשלחת הודעת תודה עם קישורי ביט ופייבוקס.",from:ICON.pay,trigger:"הטיפול הסתיים ולא שולם"},
  receipt:{name:"קבלה לאחר תשלום",cat:"pay",desc:"עם קבלת תשלום מופקת קבלה ונשלחת ללקוח בוואטסאפ.",from:ICON.pay,trigger:"התקבל תשלום"},
  birthday:{name:"ברכת יום הולדת",cat:"keep",desc:"ביום ההולדת של הלקוח נשלחת ברכה אישית.",from:ICON.user,trigger:"יום הולדת"},
  winback:{name:"חזרה לטיפול",cat:"keep",desc:"לקוח שלא הגיע כבר זמן מה ואין לו תור עתידי מקבל הזמנה לחזור.",from:ICON.user,trigger:"ימים ללא ביקור",param:["days","ימים ללא ביקור"]}
};
const DEF_SETTINGS={bizName:"מור ששון · רפואה סינית",phone:"",address:"",nav:"",directions:"",notes:"",tags:["רפואה משלימה"],
  bookingUrl:"https://mor-sasson.com",hyp:"",bit:"",paybox:"",bizId:"",invNo:1001,vat:"licensed",vatRate:18,
  policy:{freeHours:24,fullHours:12},blocked:[],blacklist:[],auto:DEF_AUTO};
const DEF_HOURS={days:{0:[{s:"09:30",e:"13:30"}],1:[{s:"09:00",e:"14:00"}],2:[{s:"09:30",e:"13:30"},{s:"16:00",e:"21:00"}],3:[{s:"12:30",e:"14:30"}],4:[{s:"09:00",e:"14:30"}],5:[],6:[]}};
function mergeSettings(o){
  const s=structuredClone(DEF_SETTINGS);const src=structuredClone(o||{});
  Object.assign(s,src);
  s.policy={...DEF_SETTINGS.policy,...(src.policy||{})};
  s.auto={};for(const k in DEF_AUTO)s.auto[k]={...DEF_AUTO[k],...((src.auto||{})[k]||{})};
  return s;
}

/* ================= store ================= */
const COLS=["services","products","packages","clients","appts","receipts","qreq"];
const st={};COLS.forEach(c=>st[c]={});
let S=mergeSettings({}), H=structuredClone(DEF_HOURS);
let db=null, demo=false, loaded=false;
function toast(t){const e=$("#toast");e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2800)}
async function guard(p,msg){try{await p}catch(e){console.error(e);toast(msg||"השמירה לא הצליחה. נסו שוב.")}}
function newId(col){return db?db.collection(col).doc().id:("l"+Math.random().toString(36).slice(2,11))}
function put(col,id,data){const body={...data};delete body.id;st[col][id]={...body,id};schedule();if(db)return guard(db.collection(col).doc(id).set(body));}
function upd(col,id,p){if(p&&p.sent&&st[col][id]&&st[col][id].sent)p={...p,sent:{...st[col][id].sent,...p.sent}};st[col][id]={...st[col][id],...p};schedule();if(db)return guard(db.collection(col).doc(id).update(p));}
function del(col,id){delete st[col][id];schedule();if(db)return guard(db.collection(col).doc(id).delete());}
function saveSettings(){schedule();if(db)return guard(db.doc("settings/main").set(structuredClone(S)));}
function saveHours(){schedule();if(db)return guard(db.doc("settings/hours").set(structuredClone(H)));}
const list=c=>Object.values(st[c]);
const svcList=()=>list("services").sort((a,b)=>(a.order??0)-(b.order??0)||String(a.name).localeCompare(b.name));
const liveAppts=()=>list("appts").filter(a=>a.date&&a.start);

/* ================= domain ================= */
const tplFor=date=>((H.days||{})[parseYmd(date).getDay()]||[]);
const hasOverride=date=>!!(H.overrides&&Object.prototype.hasOwnProperty.call(H.overrides,date));
function rawRanges(date){return hasOverride(date)?H.overrides[date]:tplFor(date)}
function rangesFor(date){
  if((S.blocked||[]).some(b=>date>=b.from&&date<=(b.to||b.from)))return[];
  return (rawRanges(date)||[]).filter(r=>r.s&&r.e);
}
function inHours(date,start,minutes){const s=toMin(start),e=s+Number(minutes||0);return rangesFor(date).some(r=>s>=toMin(r.s)&&e<=toMin(r.e))}
function overlaps(a,ignoreId){const s=aStart(a),e=aEnd(a);return liveAppts().filter(x=>x.id!==ignoreId&&x.date===a.date&&!["cancelled"].includes(x.status)&&aStart(x)<e&&aEnd(x)>s)}
function hoursLeft(a){return (aStart(a)-new Date())/3.6e6}
function policyTier(a){const h=hoursLeft(a),p=S.policy;if(h>=p.freeHours)return"free";if(h>=p.fullHours)return"deposit";return"full"}
function policyFee(a,tier){tier=tier||policyTier(a);return tier==="free"?0:tier==="deposit"?(Number(a.deposit)||0):(Number(a.price)||0)}
function policyText(){const p=S.policy;return `מדיניות ביטול: עד ${p.freeHours} שעות לפני התור ללא עלות. בין ${p.freeHours} ל-${p.fullHours} שעות: דמי ביטול בגובה המקדמה. פחות מ-${p.fullHours} שעות או אי הגעה: חיוב מלא.`}
function owed(a){
  const dep=a.depositPaid?Number(a.deposit)||0:0;
  if(a.status==="cancelled"||a.status==="noshow")return a.feePaid?0:Math.max(0,(Number(a.cancelFee)||0)-dep);
  if(a.paid)return 0;
  if(aEnd(a)>new Date())return 0;
  return Math.max(0,(Number(a.price)||0)-dep);
}
function clientAppts(cid){return liveAppts().filter(a=>a.clientId===cid).sort((a,b)=>aStart(b)-aStart(a))}
function clientBalance(cid){return clientAppts(cid).reduce((s,a)=>s+owed(a),0)}
function lastVisit(cid){const v=clientAppts(cid).filter(a=>aEnd(a)<new Date()&&!["cancelled","noshow"].includes(a.status));return v[0]||null}
function nextAppt(cid){return clientAppts(cid).filter(a=>aStart(a)>new Date()&&a.status==="booked").sort((a,b)=>aStart(a)-aStart(b))[0]||null}
function gcal(a){
  const d=a.date.replaceAll("-",""),s=toMin(a.start),e=s+(Number(a.minutes)||60),t=m=>`${pad(Math.floor(m/60))}${pad(m%60)}00`;
  return "https://calendar.google.com/calendar/render?"+new URLSearchParams({action:"TEMPLATE",text:`${a.serviceName} · ${S.bizName}`,dates:`${d}T${t(s)}/${d}T${t(e)}`,ctz:"Asia/Jerusalem",location:S.address||"",details:S.notes||""}).toString();
}
function hypLink(a){if(!S.hyp)return"";return S.hyp.replaceAll("{amount}",encodeURIComponent(a.deposit||0)).replaceAll("{name}",encodeURIComponent(a.clientName||"")).replaceAll("{id}",encodeURIComponent(a.id||""))}
function payLinks(){const l=[];if(S.bit)l.push("ביט: "+S.bit);if(S.paybox)l.push("פייבוקס: "+S.paybox);if(!l.length&&S.phone)l.push(`אפשר לשלם בביט או בפייבוקס למספר ${S.phone}`);return l.join("\n")}
function fill(tpl,v){return String(tpl||"").replace(/\{([^}]+)\}/g,(m,k)=>v[k]??"").replace(/\n{3,}/g,"\n\n").trim()}

}
function clientVars(c){return {"שם":(c.name||"").split(" ")[0],"שם_מלא":c.name||"","עסק":S.bizName,"קישור_הזמנה":S.bookingUrl,"טלפון_עסק":S.phone}}
function receiptText(r){
  const L=[S.bizName];if(S.bizId)L.push(`${S.vat==="licensed"?"עוסק מורשה":"עוסק פטור"} ${S.bizId}`);if(S.address)L.push(S.address);
  L.push("",`קבלה מס' ${r.no}`,`תאריך: ${fmtDT(r.date)}`,`לכבוד: ${r.clientName||"לקוח מזדמן"}`,"");
  r.lines.forEach(l=>L.push(`${l.name}${l.qty>1?` ×${l.qty}`:""}: ${money(l.price*l.qty)}`));
  if(r.discount)L.push(`הנחה: -${money(r.discount)}`);
  if(r.vatMode==="licensed"){const before=r.total/(1+r.vatRate/100);L.push(`סה"כ לפני מע"מ: ${money(before)}`,`מע"מ ${r.vatRate}%: ${money(r.total-before)}`)}
  L.push(`סה"כ שולם: ${money(r.total)} (${r.method})`,"","תודה ולהתראות! 🌿");
  return L.join("\n");
}
function approveMsg(a){const f=(a.clientName||"").split(" ")[0];const base=`שלום ${f}, הבקשה לתור ל${a.serviceName} ביום ${dayName(a.date)} ${fmtD(a.date)} בשעה ${a.start} אושרה.`;
  if(!(Number(a.deposit)>0))return confirmMsg(a);

const blocked=cid=>(S.blacklist||[]).includes(cid);
function dueMessages(){
  const out=[],now=new Date(),A=S.auto;
  for(const a of liveAppts()){
    if(blocked(a.clientId))continue;
    const sent=a.sent||{};
    if(a.status==="pending"&&aEnd(a)>now)out.push({kind:"pending",label:"בקשת תור חדשה",a,phone:a.phone,name:a.clientName,when:new Date(a.createdAt||now),text:""});
    if(A.confirm.on&&a.status==="booked"&&(a.source==="web"||a.byClient)&&(!(Number(a.deposit)>0)||a.depositPaid)&&!sent.confirm&&aEnd(a)>now)
      out.push({kind:"confirm",label:"אישור תור",a,phone:a.phone,name:a.clientName,when:new Date(a.createdAt||now),text:confirmMsg(a)});
    if(a.status==="cancelled"&&a.cancelledBy==="client"&&!sent.cancel)
      out.push({kind:"cancel",label:"ביטול מהלקוח",a,phone:a.phone,name:a.clientName,when:new Date(a.cancelledAt||now),text:cancelMsg(a)});
    if(A.reminder.on&&a.status==="booked"&&aStart(a)>now&&(aStart(a)-now)<=Number(A.reminder.hours||24)*3.6e6&&!sent.reminder)
      out.push({kind:"reminder",label:"תזכורת",a,phone:a.phone,name:a.clientName,when:aStart(a),text:reminderMsg(a)});
    if(A.after.on&&["booked","done"].includes(a.status)&&!a.paid&&aEnd(a)<now&&(now-aEnd(a))<3*864e5&&!sent.after&&owed(a)>0)
      out.push({kind:"after",label:"תודה ותשלום",a,phone:a.phone,name:a.clientName,when:aEnd(a),text:afterMsg(a)});
  }
  const y=String(now.getFullYear()),md=`${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
  for(const c of list("clients")){
    if(blocked(c.id))continue;const sent=c.sent||{};
    if(A.birthday.on&&c.birthday&&c.birthday.slice(5)===md&&sent.birthday!==y)
      out.push({kind:"birthday",label:"יום הולדת",c,phone:c.phone,name:c.name,when:now,text:fill(A.birthday.tpl,clientVars(c))});
    if(A.winback.on){const lv=lastVisit(c.id),days=Number(A.winback.days||60);
      if(lv&&!nextAppt(c.id)&&(now-aEnd(lv))>days*864e5&&(!sent.winback||(now-new Date(sent.winback))>days*864e5))
        out.push({kind:"winback",label:"חזרה לטיפול",c,phone:c.phone,name:c.name,when:now,text:fill(A.winback.tpl,clientVars(c))});}
  }
  return out.sort((x,y)=>x.when-y.when);
}

const cal={span:"week",day:todayStr(),showCancelled:false,svc:"",filterOpen:false};
const SPAN_DAYS={day:1,week:7,two:14};
function calStart(){const d=parseYmd(cal.day);return cal.span==="month"?startOfWeek(new Date(d.getFullYear(),d.getMonth(),1)):cal.span==="day"?d:startOfWeek(d)}
function calShift(dir){const d=parseYmd(cal.day);cal.day=cal.span==="month"?ymd(new Date(d.getFullYear(),d.getMonth()+dir,1)):ymd(addDays(d,dir*(SPAN_DAYS[cal.span]||7)))}
const narrow=()=>matchMedia("(max-width:760px)").matches;
VIEWS.calendar=function(){
  const start=calStart(),monthMode=cal.span==="month",nar=narrow();
  const n=SPAN_DAYS[cal.span]||7;
  const days=monthMode?[]:cal.span==="day"?[start]:[...Array(n)].map((_,i)=>addDays(start,i));

  bar.querySelector("[data-a=new]").onclick=()=>openDrawer(()=>newApptDrawer({date:cal.span==="day"?cal.day:(monthMode||days.some(d=>ymd(d)===todayStr()))?todayStr():ymd(days[0])}));

  // מתג תצוגה: יום / שבוע / שבועיים / חודש
  const spanSeg=el(`<div class="seg span-seg" role="group" aria-label="סוג תצוגה"><button data-s="day">יום</button><button data-s="week">שבוע</button><button data-s="two">שבועיים</button><button data-s="month">חודש</button></div>`);
  spanSeg.querySelectorAll("button").forEach(b=>{b.setAttribute("aria-pressed",String(b.dataset.s===cal.span));b.onclick=()=>{cal.span=b.dataset.s;renderView(true)}});
  bar.querySelector(".row").prepend(spanSeg);

  wrap.appendChild(bar);
  if(cal.filterOpen){
    const f=el(`<div class="cal-bar" style="justify-content:flex-start"><label class="f" style="flex-direction:row;align-items:center;gap:8px">טיפול <select id="cf-svc" style="width:auto"><option value="">הכל</option></select></label><label class="row small" style="font-weight:600"><input type="checkbox" id="cf-can" ${cal.showCancelled?"checked":""}> הצגת תורים שבוטלו</label></div>`);

  const appts=liveAppts().filter(a=>dstr.includes(a.date)&&(cal.showCancelled||a.status!=="cancelled")&&(!cal.svc||a.serviceId===cal.svc));
  let mn=24*60,mx=0;
  dstr.forEach(s=>rangesFor(s).forEach(r=>{mn=Math.min(mn,toMin(r.s));mx=Math.max(mx,toMin(r.e))}));
  appts.forEach(a=>{mn=Math.min(mn,toMin(a.start));mx=Math.max(mx,toMin(a.start)+(Number(a.minutes)||60))});
  if(mx<=mn){mn=8*60;mx=20*60}
  const sH=Math.max(0,Math.floor(mn/60)-1),eH=Math.min(24,Math.ceil(mx/60)+1);
  const HOUR=56,PX=HOUR/60,tot=(eH-sH)*HOUR;
  // בנייד: שבוע (7 ימים) נכנס כולו במסך אחד בלי גלילה אופקית
  const fitAll=nar&&days.length<=7;
  const tmpl=fitAll?`40px repeat(${days.length},minmax(0,1fr))`:`58px repeat(${days.length},minmax(${days.length===1?"0":"110px"},1fr))`;

    const da=appts.filter(a=>a.date===s).sort((a,b)=>toMin(a.start)-toMin(b.start)||(b.minutes-a.minutes));
    // lane layout
    const placed=[];let cluster=[],cEnd=-1;

};

    const past=dateS&&dateS<todayStr();
    const differs=dateS&&normR(ranges)!==normR(tplFor(dateS));
    const isBlocked=dateS&&(S.blocked||[]).some(b=>dateS>=b.from&&dateS<=(b.to||b.from));
    const box=el(`<div class="box stack" style="gap:8px;${past?"opacity:.55":""}"><div class="row between"><b>${WD[dow]}${dateS?` <span class="num muted" style="font-weight:400">${fmtD(dateS).slice(0,5)}</span>`:""}</b><div class="row">${differs?'<span class="chip gold">שונה מהקבוע</span>':""}${!ranges.length?'<span class="chip">סגור</span>':""}</div></div></div>`);
    if(isBlocked)box.appendChild(el(`<div class="warn">היום מסומן כחופשה בעמוד שעות העבודה, ולכן סגור להזמנות.</div>`));
    ranges.forEach((r,i)=>{const x=el(`<div class="row" style="flex-wrap:nowrap"><input type="time" step="300" value="${r.s}" aria-label="התחלה"><span>–</span><input type="time" step="300" value="${r.e}" aria-label="סיום"><button class="ibtn" aria-label="הסרת טווח">${ICON.trash}</button></div>`);
      const [a,b]=x.querySelectorAll("input");a.onchange=ev=>{r.s=ev.target.value;sh.changed=true};b.onchange=ev=>{r.e=ev.target.value;sh.changed=true};
      x.querySelector("button").onclick=()=>{ranges.splice(i,1);sh.changed=true;drawer.dirty=false;paintDrawer()};box.appendChild(x)});
    const acts=el(`<div class="row"></div>`);
    const add=el(`<button class="btn sm">${ICON.plus}<span>טווח</span></button>`);add.onclick=()=>{const l=ranges.at(-1);ranges.push(l?{s:l.e,e:toHM(Math.min(23*60+55,toMin(l.e)+180))}:{s:"09:00",e:"14:00"});sh.changed=true;drawer.dirty=false;paintDrawer()};acts.appendChild(add);
    if(ranges.length){const cl=el(`<button class="btn sm">סגירת היום</button>`);cl.onclick=()=>{ranges.length=0;sh.changed=true;drawer.dirty=false;paintDrawer()};acts.appendChild(cl)}
    if(differs){const rs=el(`<button class="btn sm">חזרה לקבוע</button>`);rs.onclick=()=>{sh.draft[k]=structuredClone(tplFor(dateS));sh.changed=true;drawer.dirty=false;paintDrawer()};acts.appendChild(rs)}
    box.appendChild(acts);
    // booked appointments that would fall outside
    const out=liveAppts().filter(a=>a.status==="booked"&&(dateS?a.date===dateS:(parseYmd(a.date).getDay()===dow&&a.date>=todayStr()&&!hasOverride(a.date)))&&!(ranges||[]).some(r=>r.s&&r.e&&toMin(a.start)>=toMin(r.s)&&toMin(a.start)+(Number(a.minutes)||60)<=toMin(r.e)));
    if(out.length)box.appendChild(el(`<div class="alert">${out.length===1?"תור קיים":"תורים קיימים"} מחוץ למשמרת: ${out.slice(0,3).map(a=>`${esc(a.clientName)} ${dateS?"":fmtD(a.date).slice(0,5)+" "}${a.start}`).join(", ")}${out.length>3?"…":""}. התורים לא נמחקים.</div>`));
    body.push(box);
  });
  body.push(el(`<div class="note">רק השעות שמוגדרות כאן מוצעות בקביעת תור. עמוד ההזמנה באתר (mor-sasson.com/book) מציג ללקוחות רק את השעות האלה, פחות שעות שכבר תפוסות.</div>`));
  const cancel=el(`<button class="btn">ביטול</button>`);cancel.onclick=closeDrawer;
  const save=el(`<button class="btn primary">שמירת משמרות</button>`);
  save.onclick=()=>{
    for(const k of Object.keys(sh.draft)){const rs=sh.draft[k].filter(r=>r.s||r.e);
      if(rs.some(r=>!r.s||!r.e||toMin(r.e)<=toMin(r.s))){toast(`יום ${WD[sh.mode==="week"?parseYmd(k).getDay():Number(k)]}: שעת הסיום צריכה להיות אחרי שעת ההתחלה`);return}
      const srt=[...rs].sort((a,b)=>toMin(a.s)-toMin(b.s));if(srt.some((r,i)=>i&&toMin(r.s)<toMin(srt[i-1].e))){toast(`יום ${WD[sh.mode==="week"?parseYmd(k).getDay():Number(k)]}: יש טווחים חופפים`);return}
      sh.draft[k]=srt}
    if(sh.mode==="week"){const ov={...(H.overrides||{})};const cut=ymd(addDays(new Date(),-1));
      Object.keys(ov).forEach(d=>{if(d<cut)delete ov[d]});
      Object.entries(sh.draft).forEach(([d,rs])=>{if(normR(rs)===normR(tplFor(d)))delete ov[d];else ov[d]=rs.map(r=>({s:r.s,e:r.e}))});
      H={...H,overrides:ov};}
    else{const days={};for(let d=0;d<7;d++)days[d]=sh.draft[d].map(r=>({s:r.s,e:r.e}));H={...H,days};}
    hrDraft=null;saveHours();sh.changed=false;toast("המשמרות נשמרו והיומן עודכן");closeDrawer();
  };
  return frame("עריכת משמרות",body,[cancel,save]);
}

      return frame("תור חדש",items,[op,cl])});
  };
  const cancel=el(`<button class="btn">ביטול</button>`);cancel.onclick=closeDrawer;
  return frame("תור חדש",b,[cancel,save]);
}

const DEF_QUESTIONNAIRES=[{id:"q-intake",title:"שאלון מקדים לטיפול ברפואה סינית",body:""},{id:"q-terms",title:"תקנון",body:""}];
function qList(){if(!Array.isArray(S.questionnaires))S.questionnaires=structuredClone(DEF_QUESTIONNAIRES);return S.questionnaires}
let qPick=null;
const waPhone=p=>{let d=String(p||"").replace(/\D/g,"");if(d.startsWith("0"))d="972"+d.slice(1);return d};
const randHex=()=>Array.from(crypto.getRandomValues(new Uint8Array(16)),b=>b.toString(16).padStart(2,"0")).join("");
// אותו פורמט שהלקוח רואה בדף /q: # כותרת · ? שאלה כן/לא + פירוט · - שדה טקסט · ✓ הסכמה · שורה אחרת = הסבר
function parseQ(body){return String(body||"").split("\n").map(s=>s.trim()).filter(Boolean).map(s=>{
  if(s.startsWith("# "))return {k:"h",t:s.slice(2)};if(s.startsWith("? "))return {k:"yn",t:s.slice(2)};
  if(s.startsWith("- "))return {k:"txt",t:s.slice(2)};if(s.startsWith("✓ "))return {k:"ok",t:s.slice(2)};return {k:"p",t:s}})}

      .map(c=>({c,lv:lastVisit(c.id),nx:nextAppt(c.id),bal:clientBalance(c.id)}));
    if(cl.sort==="name")rows.sort((a,b)=>String(a.c.name).localeCompare(b.c.name,"he"));
    if(cl.sort==="recent")rows.sort((a,b)=>(b.lv?aStart(b.lv):0)-(a.lv?aStart(a.lv):0));
    if(cl.sort==="debt")rows.sort((a,b)=>b.bal-a.bal);
    box.innerHTML="";
    if(!rows.length){box.appendChild(el(`<div class="empty">${list("clients").length?"לא נמצאו לקוחות":"עדיין אין לקוחות. הוסיפו לקוח בכפתור + או קבעו תור ביומן."}</div>`));return}
    const t=el(`<div class="table-wrap"><table><thead><tr><th>שם</th><th>טלפון</th><th>ביקור אחרון</th><th>תור הבא</th><th>יתרה</th><th></th></tr></thead><tbody></tbody></table></div>`);
    rows.forEach(({c,lv,nx,bal})=>{const tr=el(`<tr class="click"><td><b>${esc(c.name)}</b>${c.example?' <span class="chip ex">דוגמה</span>':""}</td><td class="ltr num" style="text-align:right">${esc(c.phone||"")}</td><td class="num">${lv?fmtD(lv.date):"—"}</td><td class="num">${nx?`${fmtD(nx.date)} ${nx.start}`:"—"}</td><td class="num ${bal>0?"down":""}">${bal>0?money(bal):"—"}</td><td></td></tr>`);
      tr.lastElementChild.appendChild(waBtn(c.phone,`שלום ${(c.name||"").split(" ")[0]}, `,"","" ,"ibtn"));tr.lastElementChild.querySelector("a").setAttribute("aria-label","וואטסאפ");tr.lastElementChild.querySelector("a").onclick=e=>e.stopPropagation();
      tr.onclick=()=>openDrawer(()=>clientDrawer(c.id));t.querySelector("tbody").appendChild(tr)});
    box.appendChild(t)};
  draw();
  const fab=el(`<button class="fab" aria-label="לקוח חדש">${ICON.plus}</button>`);fab.onclick=()=>openDrawer(()=>clientDrawer(null));p.appendChild(fab);
  return p;
};
let clTab="details";
function clientDrawer(id){
  const c=id?st.clients[id]:{name:"",phone:"",email:"",birthday:"",notes:""};
  if(id&&!c)return frame("לקוח",el(`<div class="empty">הלקוח נמחק</div>`));
  const body=[];
  if(id){body.push(el(`<div class="box who"><div class="ava">${esc(initial(c.name))}</div><div style="flex:1"><div class="nm">${esc(c.name)}</div><div class="muted small">יתרה: <span class="${clientBalance(id)>0?"down":""}">${money(clientBalance(id))}</span>${blocked(id)?" · לא מקבל הודעות אוטומטיות":""}</div></div></div>`));
    body.push(tabsEl([["details","פרטים"],["appts","תורים"],["pay","תשלומים"]],clTab,k=>{clTab=k;drawer.dirty=false;paintDrawer()}))}
  if(!id||clTab==="details"){
    const f=el(`<div class="box form">
      <label class="f full">שם מלא<input id="c-name" value="${esc(c.name)}"></label>
      <label class="f">טלפון נייד<input id="c-phone" type="tel" value="${esc(c.phone||"")}"></label>
      <label class="f">אימייל<input id="c-email" type="email" value="${esc(c.email||"")}"></label>
      <label class="f">תאריך לידה<input id="c-bday" type="date" value="${esc(c.birthday||"")}"></label>
      <label class="f full">הערות רפואיות / כלליות<textarea id="c-notes">${esc(c.notes||"")}</textarea></label></div>`);
    body.push(f);
    // טפסים חתומים שהועברו מ-LEE (נשמרים בדלי client-forms, גישה בקישור זמני)
    // שאלונים שהלקוח מילא אונליין (נשמרים בבקשות qreq)
    if(id){const qd=list("qreq").filter(r=>r.clientId===id&&r.status==="done").sort((a,b)=>(b.doneAt||"").localeCompare(a.doneAt||""));
      if(qd.length){const qb=el(`<div class="box"><div class="muted small" style="margin-bottom:6px">שאלונים שמולאו</div></div>`);
        qd.forEach(r=>{const when=new Date(r.doneAt||r.createdAt).toLocaleString("he-IL",{dateStyle:"short",timeStyle:"short"});
          const d=el(`<details class="box" style="margin:6px 0;padding:8px 12px"><summary>${esc(r.title||"שאלון")} · ${esc(when)}</summary></details>`);
          const lines=parseQ(r.body).map((it,i)=>{const a=(r.answers||{})["q"+i];if(it.k==="h")return `<h4 style="margin:10px 0 4px">${esc(it.t)}</h4>`;if(it.k==="p")return "";
            if(!a)return `<div class="small muted">${esc(it.t)}: —</div>`;
            if(it.k==="yn")return `<div class="small"><b>${esc(it.t)}</b> ${esc(a.a||"—")}${a.d?` · ${esc(a.d)}`:""}</div>`;
            if(it.k==="txt")return `<div class="small"><b>${esc(it.t)}</b> ${esc(a.a||"—")}</div>`;
            if(it.k==="ok")return `<div class="small">${a.a===true?"✓":"✗"} ${esc(it.t)}</div>`;return ""}).join("");
          d.appendChild(el(`<div>${lines}${sigHtml(r)}</div>`));
          const pdfB=el(`<button class="btn sm" style="margin-top:8px">הורדה כ-PDF</button>`);pdfB.onclick=()=>qPdf(r);d.appendChild(pdfB);qb.appendChild(d)});
        body.push(qb)}}
    if(id&&(c.forms||[]).length){
      const fb=el(`<div class="box"><div class="muted small" style="margin-bottom:6px">טפסים חתומים</div>${c.forms.map((f,i)=>`<button class="btn sm" data-i="${i}" style="margin:3px">${esc(f.name)} · ${esc(f.date)}</button>`).join("")}</div>`);
      fb.querySelectorAll("button").forEach(b=>b.onclick=async()=>{const f=c.forms[+b.dataset.i];try{const {data,error}=await sb.storage.from("client-forms").createSignedUrl(f.path,300);if(error||!data)throw error||new Error("no url");window.open(data.signedUrl,"_blank")}catch(e){toast("לא ניתן לפתוח את הטופס")}});
      body.push(fb);
    }
    if(id){const bl=el(`<label class="row small" style="font-weight:600"><input type="checkbox" ${blocked(id)?"checked":""}> לא לשלוח ללקוח הודעות אוטומטיות</label>`);bl.querySelector("input").onchange=e=>{S.blacklist=(S.blacklist||[]).filter(x=>x!==id);if(e.target.checked)S.blacklist.push(id);saveSettings()};body.push(bl);
      const dl=el(`<button class="btn danger sm" style="align-self:flex-start">מחיקת הלקוח</button>`);dl.onclick=()=>{if(clientAppts(id).length){toast("ללקוח יש תורים ברישום, לכן לא ניתן למחוק");return}if(!dl.dataset.s){dl.dataset.s=1;dl.textContent="לחצו שוב למחיקה";return}del("clients",id);closeDrawer();toast("הלקוח נמחק")};body.push(dl)}
    const save=el(`<button class="btn primary">${id?"שמירה":"הוספת לקוח"}</button>`);
    save.onclick=()=>{const g=s=>body[id?2:0].querySelector(s).value.trim();const d={name:g("#c-name"),phone:g("#c-phone"),email:g("#c-email"),birthday:g("#c-bday"),notes:g("#c-notes")};
      if(!d.name){toast("מלאו שם");return}if(intlPhone(d.phone).length<11){toast("מלאו מספר נייד תקין");return}
      if(id){upd("clients",id,d);liveAppts().filter(a=>a.clientId===id).forEach(a=>{if(a.clientName!==d.name||a.phone!==d.phone)upd("appts",a.id,{clientName:d.name,phone:d.phone})});drawer.dirty=false;toast("נשמר");paintDrawer()}
      else{const nid=newId("clients");put("clients",nid,{...d,createdAt:new Date().toISOString()});openDrawer(()=>clientDrawer(nid));toast("הלקוח נוסף")}};
    const na=el(`<button class="btn">תור חדש</button>`);na.onclick=()=>openDrawer(()=>newApptDrawer({clientId:id}));
    return frame(id?"כרטיס לקוח":"לקוח חדש",body,id?[na,save]:[save]);
  }
  if(clTab==="appts"){
    const ap=clientAppts(id);
    if(!ap.length)body.push(el(`<div class="empty">אין תורים</div>`));
    ap.forEach(a=>{const r=el(`<div class="box row between" style="cursor:pointer"><div><b class="num">${fmtD(a.date)} · ${a.start}</b><div class="small muted">${esc(a.serviceName)} · ${money(a.price)}</div></div>${statusChip(a)}</div>`);r.onclick=()=>openDrawer(()=>apptDrawer(a.id));body.push(r)});
  }
  if(clTab==="pay"){
    const rc=list("receipts").filter(r=>r.clientId===id).sort((a,b)=>String(b.date).localeCompare(a.date));
    const bal=clientBalance(id);
    if(bal>0){const ch=el(`<button class="btn ink">גביית יתרה ${money(bal)}</button>`);ch.onclick=()=>{pos.clientId=id;pos.lines=[];clientAppts(id).filter(a=>owed(a)>0).forEach(a=>posAddAppt(a));closeDrawer();location.hash="pos"};body.push(ch)}
    if(!rc.length)body.push(el(`<div class="empty">אין קבלות</div>`));
    rc.forEach(r=>{const x=el(`<div class="box row between"><div><b>קבלה #${r.no} · ${money(r.total)}</b><div class="small muted">${fmtDT(r.date)} · ${esc(r.method)}</div></div></div>`);x.appendChild(waBtn(c.phone,receiptText(r),"שליחה",null,"btn wa sm"));body.push(x)});
  }
  const na=el(`<button class="btn">תור חדש</button>`);na.onclick=()=>openDrawer(()=>newApptDrawer({clientId:id}));
  const ch=el(`<button class="btn ink">חיוב</button>`);ch.onclick=()=>{pos.clientId=id;closeDrawer();location.hash="pos"};
  return frame("כרטיס לקוח",body,[na,ch]);
}

const pos={clientId:null,lines:[],discount:0,method:"ביט",tab:"fav",done:null};
function posAddAppt(a){if(pos.lines.some(l=>l.apptId===a.id))return;const cancel=a.status==="cancelled"||a.status==="noshow";
  const amount=cancel?owed(a):Math.max(0,(a.price||0)-(a.depositPaid?a.deposit||0:0));
  pos.lines.push({name:cancel?`דמי ביטול · ${a.serviceName} ${fmtD(a.date)}`:`${a.serviceName} · ${fmtD(a.date)}${a.depositPaid?" (בניכוי מקדמה)":""}`,qty:1,price:amount,apptId:a.id,kind:cancel?"fee":"appt"})}
function posStartFor(a){pos.done=null;pos.clientId=a.clientId;pos.lines=[];pos.discount=0;posAddAppt(a)}
VIEWS.pos=function(){
  const w=el(`<div class="pos"></div>`);
  const items=el(`<div class="pos-items"><div class="bar"></div><div class="tiles"></div></div>`);
  const bar=items.querySelector(".bar");
  bar.appendChild(tabsEl([["fav","טיפולים"],["appts","תורים לתשלום"],["products","מוצרים"],["packages","כרטיסיות"]],pos.tab,k=>{pos.tab=k;renderView(true)}));
  const gen=el(`<button class="btn sm">${ICON.plus}<span>פריט כללי</span></button>`);gen.onclick=()=>{pos.lines.push({name:"פריט כללי",qty:1,price:0,kind:"general"});pos.done=null;renderView(true)};bar.appendChild(gen);
  const tiles=items.querySelector(".tiles");
  const tile=(k,name,price,c,fn)=>{const t=el(`<button class="tile" style="--c:${c||"var(--jade)"}"><span class="k">${esc(k)}</span><span>${esc(name)}</span><span class="p num">${money(price)}</span></button>`);t.onclick=()=>{fn();pos.done=null;renderView(true)};tiles.appendChild(t)};
  if(pos.tab==="fav"){svcList().forEach(s=>tile(s.category||"טיפול",`${s.name} | ${s.minutes} ד׳`,s.price,s.color,()=>pos.lines.push({name:s.name,qty:1,price:Number(s.price)||0,kind:"service"})));if(!svcList().length)tiles.appendChild(el(`<div class="empty">אין טיפולים במחירון</div>`))}
  if(pos.tab==="products"){list("products").forEach(s=>tile("מוצר",s.name,s.price,"var(--gold)",()=>pos.lines.push({name:s.name,qty:1,price:Number(s.price)||0,kind:"product",productId:s.id})));if(!list("products").length)tiles.appendChild(el(`<div class="empty">אין מוצרים. מוסיפים במחירון ← מוצרים.</div>`))}
  if(pos.tab==="packages"){list("packages").forEach(s=>tile(`${s.sessions} טיפולים`,s.name,s.price,"var(--plum)",()=>pos.lines.push({name:s.name,qty:1,price:Number(s.price)||0,kind:"package",packageId:s.id})));if(!list("packages").length)tiles.appendChild(el(`<div class="empty">אין כרטיסיות. מוסיפים במחירון ← כרטיסיות.</div>`))}
  if(pos.tab==="appts"){
    const ap=liveAppts().filter(a=>(!pos.clientId||a.clientId===pos.clientId)&&(owed(a)>0||(a.status==="booked"&&!a.paid&&a.date===todayStr()))).sort((a,b)=>aStart(a)-aStart(b));
    ap.forEach(a=>tile(`${fmtD(a.date)} ${a.start}`,`${a.clientName} · ${a.serviceName}`,owed(a)||Math.max(0,a.price-(a.depositPaid?a.deposit:0)),(st.services[a.serviceId]||{}).color,()=>{if(!pos.clientId)pos.clientId=a.clientId;posAddAppt(a)}));
    liveAppts().filter(a=>(!pos.clientId||a.clientId===pos.clientId)&&a.status==="booked"&&!a.depositPaid&&Number(a.deposit)>0&&aStart(a)>new Date()).forEach(a=>tile(`מקדמה · ${fmtD(a.date)}`,`${a.clientName} · ${a.serviceName}`,a.deposit,"var(--gold)",()=>{if(!pos.clientId)pos.clientId=a.clientId;if(!pos.lines.some(l=>l.apptId===a.id))pos.lines.push({name:`מקדמה · ${a.serviceName} ${fmtD(a.date)}`,qty:1,price:Number(a.deposit),apptId:a.id,kind:"deposit"})}));
    if(!tiles.children.length)tiles.appendChild(el(`<div class="empty">${pos.clientId?"אין ללקוח תורים פתוחים לתשלום":"אין תורים פתוחים לתשלום"}</div>`));
  }
  w.appendChild(items);
  // cart
  const cart=el(`<div class="cart"></div>`);
  const c=pos.clientId&&st.clients[pos.clientId];
  const cc=el(`<div class="row between" style="padding:12px 14px;border-bottom:1px solid var(--line)"><div class="who"><div class="ava">${c?esc(initial(c.name)):"?"}</div><div><div class="small muted">פרטי הלקוח</div><b>${c?esc(c.name):"לקוח מזדמן"}</b></div></div></div>`);
  const pickBtn=el(`<button class="btn sm">${c?"החלפה":"בחירת לקוח"}</button>`);
  pickBtn.onclick=()=>{const box=el(`<div style="padding:8px 14px" class="stack"><input placeholder="חיפוש לקוח" id="pos-q"><div class="pick"></div></div>`);cc.after(box);const inp=box.querySelector("input"),pk=box.querySelector(".pick");
    const dr=()=>{pk.innerHTML="";const q=inp.value.trim();list("clients").filter(x=>!q||(x.name||"").includes(q)||(intlPhone(q)&&intlPhone(x.phone).includes(intlPhone(q)))).slice(0,6).forEach(x=>{const b=el(`<button><span>${esc(x.name)}</span><span class="muted ltr small">${esc(x.phone||"")}</span></button>`);b.onclick=()=>{pos.clientId=x.id;renderView(true)};pk.appendChild(b)});
      const g=el(`<button><span>לקוח מזדמן</span></button>`);g.onclick=()=>{pos.clientId=null;renderView(true)};pk.appendChild(g)};inp.oninput=dr;dr();inp.focus();pickBtn.hidden=true};
  cc.appendChild(pickBtn);cart.appendChild(cc);

    const d=el(`<div class="stack" style="padding:16px"><div class="okbox">התשלום נרשם · קבלה #${r.no} · ${money(r.total)}</div><div class="preview">${esc(receiptText(r))}</div></div>`);
    if(r.phone)d.appendChild(waBtn(r.phone,receiptText(r),"שליחת הקבלה בוואטסאפ",()=>upd("receipts",r.id,{sentAt:new Date().toISOString()}),"btn primary"));
    const nw=el(`<button class="btn">תשלום חדש</button>`);nw.onclick=()=>{pos.done=null;pos.lines=[];pos.discount=0;pos.clientId=null;renderView(true)};d.appendChild(nw);
    cart.appendChild(d);w.appendChild(cart);return w;
  }
  const ls=el(`<div class="lines"></div>`);
  if(!pos.lines.length)ls.appendChild(el(`<div class="empty" style="margin:14px">בחרו טיפול, תור או מוצר כדי להוסיף לתשלום</div>`));
  pos.lines.forEach((l,i)=>{const r=el(`<div class="cline"><input value="${esc(l.name)}" aria-label="שם הפריט" style="border:0;padding:2px 0;font-weight:600;background:none"><div class="qty"><button aria-label="פחות">−</button><span class="num" style="min-width:18px;text-align:center">${l.qty}</span><button aria-label="יותר">+</button></div><input type="number" value="${l.price}" aria-label="מחיר" style="width:84px"></div>`);
    const [nm,pr]=r.querySelectorAll("input");nm.onchange=e=>l.name=e.target.value;pr.onchange=e=>{l.price=Number(e.target.value)||0;renderView(true)};
    const [m,p]=r.querySelectorAll(".qty button");m.onclick=()=>{l.qty--;if(l.qty<1)pos.lines.splice(i,1);renderView(true)};p.onclick=()=>{l.qty++;renderView(true)};ls.appendChild(r)});
  cart.appendChild(ls);
  const sub=pos.lines.reduce((s,l)=>s+l.price*l.qty,0),tot=Math.max(0,sub-(Number(pos.discount)||0));
  const vatL=S.vat==="licensed",before=tot/(1+S.vatRate/100);
  const tt=el(`<div class="totals"><span>הנחה כללית ₪</span><input type="number" min="0" value="${pos.discount||0}" style="width:84px;padding:3px 6px" id="pos-disc">
    ${vatL?`<span class="muted">סה"כ לפני מע"מ</span><span class="num muted">${money(before)}</span><span class="muted">מע"מ ${S.vatRate}%</span><span class="num muted">${money(tot-before)}</span>`:`<span class="muted">עוסק פטור</span><span></span>`}
    <span class="grand">סה"כ</span><span class="grand num">${money(tot)}</span>
    <span>אמצעי תשלום</span><select id="pos-m" style="width:auto;padding:3px 6px">${METHODS.map(m=>`<option ${m===pos.method?"selected":""}>${m}</option>`).join("")}</select></div>`);

  tt.querySelector("#pos-m").onchange=e=>pos.method=e.target.value;

  const act=el(`<div class="row" style="padding:12px 14px;border-top:1px solid var(--line)"></div>`);

  const charge=el(`<button class="btn ink" style="flex:1;padding:11px" ${pos.lines.length?"":"disabled"}>תשלום התקבל · הפקת קבלה</button>`);

    pos.done={...r,id:rid};pos.lines=[];pos.discount=0;renderView(true);

VIEWS.hours=function(){
  if(!hrDraft)hrDraft=structuredClone(H);
  const p=el(`<div class="page"><div class="page-head"><div><div class="crumbs">ניהול זמינות › שעות עבודה</div><h1>שעות עבודה</h1><p>זה השבוע הקבוע. מהשעות האלה נבנים הזמנים הפנויים ביומן. לשינוי בשבוע מסוים: "עריכת משמרות" ביומן.</p></div><div class="row"><span class="chip jade num" id="tot"></span><button class="btn" id="hr-reset">ביטול שינויים</button><button class="btn primary" id="hr-save">שמירה</button></div></div></div>`);
  const wk=el(`<div class="week"></div>`);
  const total=()=>{let m=0;for(let d=0;d<7;d++)(hrDraft.days[d]||[]).forEach(r=>{if(r.s&&r.e)m+=Math.max(0,toMin(r.e)-toMin(r.s))});p.querySelector("#tot").textContent=`${Math.round(m/6)/10} שעות בשבוע`};
  for(let d=0;d<7;d++){
    hrDraft.days[d]=hrDraft.days[d]||[];
    const c=el(`<div class="wday"><h3>${WD[d]}</h3></div>`);
    if(!hrDraft.days[d].length)c.appendChild(el(`<div class="note" style="text-align:center">אין משמרות</div>`));
    hrDraft.days[d].forEach((r,i)=>{const x=el(`<div class="rng"><input type="time" value="${r.s}" aria-label="התחלה"><input type="time" value="${r.e}" aria-label="סיום"><button class="btn sm danger">הסרה</button></div>`);
      const [a,b]=x.querySelectorAll("input");a.onchange=e=>{r.s=e.target.value;total()};b.onchange=e=>{r.e=e.target.value;total()};
      x.querySelector("button").onclick=()=>{hrDraft.days[d].splice(i,1);renderView(true)};c.appendChild(x)});
    const add=el(`<button class="btn sm">${ICON.plus}<span>טווח</span></button>`);add.onclick=()=>{const last=hrDraft.days[d].at(-1);hrDraft.days[d].push(last?{s:last.e,e:toHM(Math.min(23*60+59,toMin(last.e)+180))}:{s:"09:00",e:"14:00"});renderView(true)};c.appendChild(add);
    wk.appendChild(c);
  }
  p.appendChild(el(`<div class="table-wrap" style="border:0;background:none"></div>`)).appendChild(wk);
  p.querySelector("#hr-save").onclick=()=>{for(let d=0;d<7;d++){if(hrDraft.days[d].some(r=>!r.s||!r.e||toMin(r.e)<=toMin(r.s))){toast(`יום ${WD[d]}: שעת הסיום צריכה להיות אחרי שעת ההתחלה`);return}}H={...structuredClone(hrDraft),overrides:H.overrides||{}};saveHours();toast("שעות העבודה נשמרו")};
  p.querySelector("#hr-reset").onclick=()=>{hrDraft=structuredClone(H);renderView(true)};
  total();
  // blocked days
  const bl=el(`<div class="card stack"><h2>חופשות וימים חסומים</h2><div class="note">בימים האלה היומן לא יציע שעות פנויות.</div><div class="stack" id="bl"></div>
    <div class="row"><label class="f">מתאריך<input type="date" id="b-f"></label><label class="f">עד תאריך<input type="date" id="b-t"></label><label class="f" style="flex:1">סיבה<input id="b-n" placeholder="חופשה, כנס…"></label><button class="btn" id="b-add" style="align-self:end">הוספה</button></div></div>`);
  (S.blocked||[]).forEach((b,i)=>{const r=el(`<div class="row between box"><span class="num">${fmtD(b.from)}${b.to&&b.to!==b.from?` – ${fmtD(b.to)}`:""} ${b.note?`· ${esc(b.note)}`:""}</span><button class="btn sm danger">הסרה</button></div>`);r.querySelector("button").onclick=()=>{S.blocked.splice(i,1);saveSettings()};bl.querySelector("#bl").appendChild(r)});
  bl.querySelector("#b-add").onclick=()=>{const f=bl.querySelector("#b-f").value,t=bl.querySelector("#b-t").value||f;if(!f){toast("בחרו תאריך");return}S.blocked=[...(S.blocked||[]),{from:f,to:t<f?f:t,note:bl.querySelector("#b-n").value.trim()}];saveSettings();toast("נוסף")};
  p.appendChild(bl);
  return p;
};

let rep=null,repFrom=null,repTo=null;
const REPORTS=[
  {cat:"לקוחות",sub:"סקירת לקוחות",icon:ICON.user,items:[["new","לקוחות חדשים"],["lapsed","לקוחות שלא חזרו"],["birthdays","ימי הולדת קרובים"],["debts","דוח חייבים"]]},
  {cat:"הנהלת חשבונות",sub:"הכנסות וקבלות",icon:ICON.pay,items:[["receipts","דוח תקבולים"],["methods","תקבולים לפי אמצעי תשלום"],["items","מכירות לפי פריטים"]]},
  {cat:"נוכחות",sub:"תורים והיעדרויות",icon:ICON.cal,items:[["appts","דוח תורים"],["absences","ביטולים ואי הגעה"]]},
  {cat:"שימוש במערכת",sub:"הודעות ותזכורות",icon:ICON.bell,items:[["messages","הודעות שנשלחו"]]}
];
function runReport(k,from,to){
  const F=parseYmd(from),T=addDays(parseYmd(to),1),inR=d=>d>=F&&d<T;
  const A=()=>liveAppts().filter(a=>inR(aStart(a))).sort((a,b)=>aStart(a)-aStart(b));
  const R=()=>list("receipts").filter(r=>inR(new Date(r.date))).sort((a,b)=>String(a.date).localeCompare(b.date));
  const stl=a=>({booked:"מוזמן",done:"הגיע/ה",noshow:"לא הגיע/ה",cancelled:"בוטל"})[a.status]||a.status;
  switch(k){
    case"appts":{const a=A();return{cols:["תאריך","שעה","לקוח","טיפול","מחיר","סטטוס","שולם"],rows:a.map(x=>[fmtD(x.date),x.start,x.clientName,x.serviceName,money(x.price),stl(x),x.paid?"כן":"לא"]),sum:`${a.filter(x=>x.status!=="cancelled").length} תורים · ${a.filter(x=>x.status==="cancelled").length} בוטלו`}}
    case"absences":{const a=A().filter(x=>["cancelled","noshow"].includes(x.status));return{cols:["תאריך","שעה","לקוח","סטטוס","דמי ביטול","שולמו"],rows:a.map(x=>[fmtD(x.date),x.start,x.clientName,stl(x),money(x.cancelFee||0),x.feePaid?"כן":(x.cancelFee?"לא":"—")]),sum:`${a.length} ביטולים ואי הגעות · דמי ביטול ${money(a.reduce((s,x)=>s+(x.cancelFee||0),0))}`}}
    case"receipts":{const r=R();return{cols:["מס'","תאריך","לקוח","אמצעי","סכום"],rows:r.map(x=>[x.no,fmtDT(x.date),x.clientName,x.method,money(x.total)]),sum:`${r.length} קבלות · סה"כ ${money(r.reduce((s,x)=>s+x.total,0))}`}}
    case"methods":{const m={};R().forEach(x=>m[x.method]=(m[x.method]||0)+x.total);return{cols:["אמצעי תשלום","סכום"],rows:Object.entries(m).map(([k,v])=>[k,money(v)]),sum:`סה"כ ${money(Object.values(m).reduce((s,v)=>s+v,0))}`}}
    case"items":{const m={};R().forEach(x=>x.lines.forEach(l=>{const o=m[l.name]||(m[l.name]={q:0,t:0});o.q+=l.qty;o.t+=l.price*l.qty}));return{cols:["פריט","כמות","סכום"],rows:Object.entries(m).sort((a,b)=>b[1].t-a[1].t).map(([k,v])=>[k,v.q,money(v.t)]),sum:""}}
    case"new":{const c=list("clients").filter(x=>x.createdAt&&inR(new Date(x.createdAt)));return{cols:["שם","טלפון","נוסף בתאריך"],rows:c.map(x=>[x.name,x.phone,fmtDT(x.createdAt)]),sum:`${c.length} לקוחות חדשים`}}
    case"lapsed":{const d=Number(S.auto.winback.days||60);const c=list("clients").map(x=>({x,lv:lastVisit(x.id)})).filter(o=>o.lv&&!nextAppt(o.x.id)&&(new Date()-aEnd(o.lv))>d*864e5);return{cols:["שם","טלפון","ביקור אחרון"],rows:c.map(o=>[o.x.name,o.x.phone,fmtD(o.lv.date)]),sum:`לקוחות בלי ביקור ${d} ימים ובלי תור עתידי · ${c.length}`,noRange:true}}
    case"birthdays":{const n=new Date();const c=list("clients").filter(x=>x.birthday).map(x=>{const b=parseYmd(x.birthday);let nx=new Date(n.getFullYear(),b.getMonth(),b.getDate());if(nx<new Date(n.toDateString()))nx.setFullYear(n.getFullYear()+1);return{x,nx}}).filter(o=>o.nx-n<31*864e5).sort((a,b)=>a.nx-b.nx);return{cols:["שם","טלפון","יום הולדת"],rows:c.map(o=>[o.x.name,o.x.phone,`${pad(o.nx.getDate())}/${pad(o.nx.getMonth()+1)}`]),sum:"ב-30 הימים הקרובים",noRange:true}}
    case"debts":{const c=list("clients").map(x=>({x,b:clientBalance(x.id)})).filter(o=>o.b>0).sort((a,b)=>b.b-a.b);return{cols:["שם","טלפון","יתרה"],rows:c.map(o=>[o.x.name,o.x.phone,money(o.b)]),sum:`סה"כ לגבייה ${money(c.reduce((s,o)=>s+o.b,0))}`,noRange:true}}
    case"messages":{const rows=[];const N={confirm:"אישור תור",reminder:"תזכורת",after:"תודה ותשלום",cancel:"ביטול"};liveAppts().forEach(a=>Object.entries(a.sent||{}).forEach(([k,v])=>{if(v&&inR(new Date(v)))rows.push([fmtDT(v),N[k]||k,a.clientName,`${fmtD(a.date)} ${a.start}`])}));list("receipts").forEach(r=>{if(r.sentAt&&inR(new Date(r.sentAt)))rows.push([fmtDT(r.sentAt),"קבלה",r.clientName,`#${r.no}`])});rows.sort((a,b)=>a[0].localeCompare(b[0]));return{cols:["נשלח","סוג","לקוח","פרטים"],rows,sum:`${rows.length} הודעות`}}
  }
}
VIEWS.reports=function(){
  const p=el(`<div class="page"></div>`);
  if(!rep){
    p.appendChild(el(`<div class="page-head"><h1>דוחות</h1></div>`));
    const g=el(`<div class="grid-auto" style="grid-template-columns:repeat(auto-fill,minmax(280px,1fr))"></div>`);
    REPORTS.forEach(c=>{const x=el(`<div class="card rep-cat"><header><span style="color:var(--jade)">${c.icon.replace("<svg",'<svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.6"')}</span><b>${c.cat}</b><span class="note">${c.sub}</span></header></div>`);
      c.items.forEach(([k,l])=>{const b=el(`<button class="rep-link"><span>${l}</span><span aria-hidden="true">←</span></button>`);b.onclick=()=>{rep=[k,l];renderView(true)};x.appendChild(b)});g.appendChild(x)});
    p.appendChild(g);return p;
  }
  const n=new Date();repFrom=repFrom||ymd(new Date(n.getFullYear(),n.getMonth(),1));repTo=repTo||ymd(new Date(n.getFullYear(),n.getMonth()+1,0));
  const r=runReport(rep[0],repFrom,repTo);
  const head=el(`<div class="page-head"><div><div class="crumbs"><a href="#reports" id="rb" style="color:inherit">דוחות</a> › ${rep[1]}</div><h1>${rep[1]}</h1><p>${esc(r.sum)}</p></div>
    <div class="row">${r.noRange?"":`<label class="f">מתאריך<input type="date" id="rf" value="${repFrom}"></label><label class="f">עד<input type="date" id="rt" value="${repTo}"></label>`}<button class="btn" id="csv" style="align-self:end">ייצוא CSV</button></div></div>`);
  head.querySelector("#rb").onclick=e=>{e.preventDefault();rep=null;renderView(true)};
  if(!r.noRange){head.querySelector("#rf").onchange=e=>{repFrom=e.target.value;renderView(true)};head.querySelector("#rt").onchange=e=>{repTo=e.target.value;renderView(true)}}
  head.querySelector("#csv").onclick=()=>{const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;const csv="\ufeff"+[r.cols,...r.rows].map(x=>x.map(q).join(",")).join("\r\n");
    const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download=`${rep[1]}.csv`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)};
  p.appendChild(head);
  if(!r.rows.length){p.appendChild(el(`<div class="empty">אין נתונים בטווח הזה</div>`));return p}
  const t=el(`<div class="table-wrap"><table><thead><tr>${r.cols.map(c=>`<th>${c}</th>`).join("")}</tr></thead><tbody>${r.rows.map(x=>`<tr>${x.map(v=>`<td class="num">${esc(v)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`);
  p.appendChild(t);return p;
};

function sigHtml(r){const s=(r.answers||{}).sig;if(!s)return "";
  const img=typeof s.img==="string"&&s.img.startsWith("data:image/png;base64,")?s.img:"";
  const at=s.signedAt?new Date(s.signedAt).toLocaleString("he-IL",{dateStyle:"short",timeStyle:"short"}):"";
  return `<div style="margin-top:14px;padding-top:8px;border-top:1px solid #ccc"><div style="font-weight:600;margin-bottom:4px">חתימה</div>${img?`<img src="${img}" alt="חתימה" style="max-height:90px;max-width:260px;border-bottom:1px solid #333;display:block">`:""}<div class="small">${esc(s.name||"")}${at?` · נחתם: ${esc(at)}`:""}</div></div>`}
function qPdf(r){

/* ================= data layer: Supabase (Firestore-like adapter) ================= */
function makeDb(sb){
  const docs={};COLS.forEach(c=>docs[c]={});
  const sett={};const L={};
  const on=(k,f)=>{(L[k]??=new Set()).add(f);return()=>L[k].delete(f)};
  const fire=k=>(L[k]||new Set()).forEach(f=>{try{f()}catch(e){console.error(e)}});
  const rid=()=>crypto.randomUUID().replaceAll("-","");
  const colSnap=col=>({docs:Object.entries(docs[col]||{}).map(([id,d])=>({id,data:()=>d}))});
  const setSnap=key=>({exists:key in sett,data:()=>sett[key]});
  const chk=r=>{if(r.error)throw r.error;return r};
  const api={
    async load(){
      for(let from=0;;from+=1000){
        const {data}=chk(await sb.from("docs").select("col,id,data").range(from,from+999));
        data.forEach(r=>{(docs[r.col]??={})[r.id]=r.data});
        if(data.length<1000)break;
      }
      chk(await sb.from("settings").select("key,data")).data.forEach(r=>sett[r.key]=r.data);
    },
    listen(){
      sb.channel("clinic")
        .on("postgres_changes",{event:"*",schema:"public",table:"docs"},p=>{
          const row=p.eventType==="DELETE"?p.old:p.new;if(!row||!row.col)return;
          if(p.eventType==="DELETE")delete (docs[row.col]||{})[row.id];else(docs[row.col]??={})[row.id]=row.data;
          fire("c:"+row.col)})
        .on("postgres_changes",{event:"*",schema:"public",table:"settings"},p=>{
          const row=p.eventType==="DELETE"?p.old:p.new;if(!row||!row.key)return;
          if(p.eventType==="DELETE")delete sett[row.key];else sett[row.key]=row.data;
          fire("s:"+row.key)})
        .subscribe();
    },
    collection(col){return{
      doc(id){id=id||rid();return{id,
        set:async d=>{chk(await sb.from("docs").upsert({col,id,data:d}))},
        update:async p=>{chk(await sb.rpc("doc_update",{p_col:col,p_id:id,p_patch:p}))},
        delete:async()=>{chk(await sb.from("docs").delete().match({col,id}))}}},
      onSnapshot(cb){const f=()=>cb(colSnap(col));const u=on("c:"+col,f);f();return u}}},
    doc(path){const key=path.split("/")[1];return{
      set:async d=>{chk(await sb.from("settings").upsert({key,data:d}))},
      onSnapshot(cb){const f=()=>cb(setSnap(key));const u=on("s:"+key,f);f();return u}}}
  };
  return api;
}

const CFG=window.CLINIC_CFG||{};
let sb=null;
const loginEl=$("#login");
function showLogin(msg){loginEl.hidden=false;$("#logout").hidden=true;const m=$("#lg-msg");m.hidden=!msg;m.textContent=msg||""}
async function startApp(){
  loginEl.hidden=true;$("#logout").hidden=false;
  db=makeDb(sb);
  try{await db.load()}catch(e){console.error(e);toast("אין גישה לנתונים");return}
  let n=0;const done=()=>{if(++n>=COLS.length+2)loaded=true;schedule()};
  db.doc("settings/main").onSnapshot(s=>{S=mergeSettings(s.exists?s.data():{});done()});
  db.doc("settings/hours").onSnapshot(s=>{H=s.exists?structuredClone(s.data()):structuredClone(DEF_HOURS);if(!H.days)H=structuredClone(DEF_HOURS);hrDraft=null;done()});
  COLS.forEach(col=>db.collection(col).onSnapshot(snap=>{const o={};snap.docs.forEach(x=>o[x.id]={...x.data(),id:x.id});st[col]=o;done()}));
  db.listen();
  renderView(true);renderBell();
}
async function afterSignIn(){
  const {data,error}=await sb.from("admins").select("user_id").limit(1);
  if(error||!data||!data.length){await sb.auth.signOut();showLogin("לחשבון הזה אין הרשאת ניהול.");return}
  startApp();
}
(async()=>{
  if(!CFG.url||!CFG.anonKey||!window.supabase){demo=true;loaded=true;demoSeed();toast("מצב תצוגה: הנתונים לא נשמרים");schedule();return}
  const recovering=/type=recovery/.test(location.hash);
  sb=window.supabase.createClient(CFG.url,CFG.anonKey,{auth:{persistSession:true,autoRefreshToken:true}});
  const showRec=()=>{loginEl.hidden=false;$("#loginForm").hidden=true;$("#recForm").hidden=false;$("#logout").hidden=true};
  $("#lg-forgot").onclick=async()=>{
    const em=$("#lg-email").value.trim();
    if(!em){showLogin("כתבו את האימייל ואז לחצו שכחתי סיסמה.");return}
    const b=$("#lg-forgot");b.disabled=true;
    await sb.auth.resetPasswordForEmail(em,{redirectTo:location.origin+"/admin/"});
    b.disabled=false;showLogin("אם האימייל רשום, נשלח אליו קישור לאיפוס סיסמה.");
  };
  $("#recForm").addEventListener("submit",async e=>{
    e.preventDefault();const a=$("#rc-p1").value,b2=$("#rc-p2").value,m=$("#rc-msg");
    m.hidden=false;
    if(a.length<8){m.textContent="הסיסמה צריכה להיות באורך 8 תווים לפחות.";return}
    if(a!==b2){m.textContent="שתי הסיסמאות לא זהות.";return}
    const {error}=await sb.auth.updateUser({password:a});
    if(error){m.textContent="לא הצלחנו לשמור: "+error.message;return}
    history.replaceState(null,"",location.pathname);$("#recForm").hidden=true;$("#loginForm").hidden=false;
    afterSignIn();
  });
  $("#loginForm").addEventListener("submit",async e=>{
    e.preventDefault();const b=$("#lg-btn");b.disabled=true;b.textContent="נכנס…";
    const {error}=await sb.auth.signInWithPassword({email:$("#lg-email").value.trim(),password:$("#lg-pass").value});
    b.disabled=false;b.textContent="כניסה";
    if(error){showLogin("אימייל או סיסמה לא נכונים.");return}
    afterSignIn();
  });
  $("#logout").onclick=async()=>{await sb.auth.signOut();location.reload()};
  const {data:{session}}=await sb.auth.getSession();
  if(recovering){showRec();return}
  if(session)afterSignIn();else showLogin();
  sb.auth.onAuthStateChange(ev=>{if(ev==="PASSWORD_RECOVERY")showRec()});
})();
